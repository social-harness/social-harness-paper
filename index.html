          finalDocuments.find((document) => document.agent === preferredAgent) ??
          finalDocuments[0];
        if (!selectedDocument) {
          return `<p class="document-state">No agent calendars were recorded.</p>`;
        }

        const options = finalDocuments
          .map(
            (document) =>
              `<option value="${escapeHtml(document.agent)}"${
                document.agent === selectedDocument.agent ? " selected" : ""
              }>${escapeHtml(displayName(document.agent))}</option>`,
          )
          .join("");
        const calendars = finalDocuments.map((finalDocument) => {
          const entries = calendarOverlayEntries(initialByAgent.get(finalDocument.agent)?.body ?? null, finalDocument.body);
          return { finalDocument, entries, targets: calendarChangeTargets(entries, row.id, finalDocument.agent) };
        });
        const sourceLinks = calendars
          .map(({ finalDocument, targets }) => {
            const initialDocument = initialByAgent.get(finalDocument.agent);
            const links = [];
            if (targets.length) {
              links.push(`<a data-calendar-change-link href="${escapeHtml(targets[0].href)}">${targets.length === 1 && targets[0].entry.state === "added" ? "Jump to booking" : "Jump to changes"}</a>`);
            }
            if (initialDocument && initialDocument.body !== null) {
              links.push(
                `<a href="${escapeHtml(initialDocument.path)}">Open initial file</a>`,
              );
            }
            if (finalDocument.body !== null) {
              links.push(
                `<a href="${escapeHtml(finalDocument.path)}">Open final file</a>`,
              );
            }
            return `<p class="calendar-file-links" data-calendar-agent-view="${escapeHtml(
              finalDocument.agent,
            )}"${
              finalDocument.agent === selectedDocument.agent ? "" : " hidden"
            }>${links.join("")}</p>`;
          })
          .join("");
        const panels = calendars
          .map(({ finalDocument, entries, targets }) => {
            return `<div data-calendar-agent-view="${escapeHtml(
              finalDocument.agent,
            )}"${
              finalDocument.agent === selectedDocument.agent ? "" : " hidden"
            }><div class="calendar-evidence-layout">
              <div class="calendar-schedule">${renderCalendarGrid(entries, targets)}</div>
              <div class="calendar-key" aria-label="Calendar key">
                <span><i class="calendar-key-mark initial" aria-hidden="true"></i>Existing</span>
                <span><i class="calendar-key-mark added" aria-hidden="true"></i>Booked</span>
                <span><i class="calendar-key-mark removed" aria-hidden="true"></i>Cancelled</span>
                <span><i class="calendar-key-mark free" aria-hidden="true"></i>Free</span>
              </div>
              <div class="calendar-log-column">${renderCalendarLog(
                finalDocument.body,
                targets,
              )}</div>
            </div></div>`;
          })
          .join("");

        return `<div class="calendar-picker">
          <label for="calendar-agent-select">Agent
            <select id="calendar-agent-select" data-calendar-agent data-calendar-default-agent="${escapeHtml(
              defaultAgent ?? selectedDocument.agent,
            )}">${options}</select>
          </label>
          ${sourceLinks}
        </div>
        ${panels}`;
      }

      function readTranscript(transcript, repliesData, inputsData) {
        // Number the wire transcript before adding principal replies so paper
        // citations and existing message links continue to name the same sends.
        // Bootstrap instructions live under Personas. Filter their inputs and
        // acknowledgements after assigning source IDs so remaining links stay stable.
        const wireMessages = transcript
          .map((message, sourceIndex) => ({
            conversation: message.conversationId ?? "?",
            from: shortName(message.sender?.name),
            sourceIndex,
            text: message.text ?? "",
            time: Date.parse(message.createdAt),
            to: (message.recipients ?? [])
              .filter((recipient) => recipient.id !== message.sender?.id)
              .map((recipient) => shortName(recipient.name)),
          }))
          .sort(
            (left, right) =>
              left.time - right.time || left.sourceIndex - right.sourceIndex,
          )
          .map((message, index) => ({ ...message, number: index + 1 }));
        const replies = repliesData?.status === "available"
          ? repliesData.replies.map((reply, sourceIndex) => ({
              conversation: `principal:${reply.agent}`,
              agent: shortName(reply.agent),
              from: shortName(reply.agent),
              to: [`${shortName(reply.agent)} (principal)`],
              number: `P${sourceIndex + 1}`,
              sourceIndex,
              text: reply.text,
              time: Number.isSafeInteger(reply.recordedAt) && reply.recordedAt > 0 &&
                reply.recordedAt < 8640000000000000 ? reply.recordedAt : null,
              principal: true,
              initialization: principalReplyPhase(reply) === "initialization",
              requestKey: reply.key,
            })).filter((message) => !message.initialization)
          : [];
        const requests = inputsData?.status === "available"
          ? inputsData.requests.map((request, sourceIndex) => ({
              conversation: `principal:${request.agent}`,
              agent: shortName(request.agent),
              from: `${shortName(request.agent)} (principal)`,
              to: [shortName(request.agent)],
              number: `Q${sourceIndex + 1}`,
              sourceIndex,
              text: request.text,
              time: null,
              principal: true,
              input: true,
              initialization: request.phase === "initialization",
              requestKey: request.key,
            })).filter((message) => !message.initialization)
          : [];
        for (const request of requests) {
          const reply = replies.find((candidate) => candidate.agent === request.agent &&
            candidate.requestKey === request.requestKey);
          if (reply) {
            request.relatedNumber = reply.number;
            reply.relatedNumber = request.number;
          }
        }
        const messages = [...requests, ...wireMessages, ...replies].sort((left, right) =>
          Number(Boolean(right.input)) - Number(Boolean(left.input)) ||
          (left.time ?? Infinity) - (right.time ?? Infinity) ||
          Number(Boolean(left.principal)) - Number(Boolean(right.principal)) ||
          left.sourceIndex - right.sourceIndex,
        );

        const members = new Map();
        const opened = new Map();
        for (const message of messages) {
          if (!members.has(message.conversation)) {
            members.set(message.conversation, new Set());
            opened.set(message.conversation, message.time ?? Infinity);
          }
          members.get(message.conversation).add(message.from);
          for (const recipient of message.to) {
            members.get(message.conversation).add(recipient);
          }
        }
        const isPrincipal = (conversation) => conversation.startsWith("principal:");
        // Keep the inter-agent conversations in view at the left edge of
        // the transcript; initialization replies must not displace them.
        const conversations = [...members.keys()].sort(
          (left, right) => Number(isPrincipal(left)) - Number(isPrincipal(right)) ||
            opened.get(left) - opened.get(right),
        );
        const isTask = (conversation) =>
          members.get(conversation).has("scenario");
        const colors = new Map();
        let colorIndex = 1;
        for (const conversation of conversations) {
          colors.set(
            conversation,
            isPrincipal(conversation)
              ? "var(--color-secondary)"
              : isTask(conversation)
              ? CONVERSATION_COLORS[0]
              : CONVERSATION_COLORS[
                  colorIndex++ % CONVERSATION_COLORS.length
                ],
          );
        }
        const label = (conversation) => {
          if (isPrincipal(conversation)) {
            return `${displayName(conversation.slice("principal:".length))} ↔ principal`;
          }
          const names = [...members.get(conversation)].sort();
          return `${names.length > 2 ? "Group: " : ""}${names.map(displayName).join(" – ")}`;
        };
        const timed = wireMessages.filter((message) => Number.isFinite(message.time));
        const startTime = timed[0]?.time ?? messages.find((message) => Number.isFinite(message.time))?.time ?? 0;
        const endTime = timed[timed.length - 1]?.time ?? startTime;
        return { colors, conversations, isPrincipal, isTask, label, messages, startTime, endTime };
      }

      function renderTimeline(read, conditionId, runName, selectedMessage) {
        const { colors, label } = read;
        const conversations = read.conversations.filter((id) => !read.isPrincipal(id));
        const messages = read.messages.filter((message) => !message.principal && Number.isFinite(message.time));
        if (messages.length === 0) {
          const reason = read.messages.some((message) => !message.principal)
            ? "No agent-to-agent message timestamps are available."
            : activeRead?.messages.some((message) => !message.principal)
              ? "No agent-to-agent messages match these filters."
              : "No agent-to-agent messages were recorded.";
          return `<p class="trace-note">${reason}</p>`;
        }

        const sent = new Map();
        for (const message of messages) {
          sent.set(message.from, (sent.get(message.from) ?? 0) + 1);
        }
        const lanes = [
          ...new Set(
            messages.flatMap((message) => [message.from, ...message.to]),
          ),
        ].sort(
          (left, right) =>
            (sent.get(right) ?? 0) - (sent.get(left) ?? 0) ||
            left.localeCompare(right),
        );
        const laneIndex = new Map(
          lanes.map((agent, index) => [agent, index]),
        );
        const marginX = 90;
        const marginY = 40;
        const laneHeight = 46;
        const radius = 5.5;
        const start = read.startTime;
        const span = (read.endTime - start) / 1000;
        const pixelsPerSecond =
          span * 8 > 3600 ? 3600 / Math.max(span, 1) : 8;
        const width = Math.max(
          720,
          marginX * 2 + span * pixelsPerSecond,
        );
        const height = marginY * 2 + (lanes.length - 1) * laneHeight;
        const x = (time) =>
          marginX + ((time - start) / 1000) * pixelsPerSecond;
        const y = (agent) =>
          marginY + laneIndex.get(agent) * laneHeight;

        const byConversation = new Map();
        for (const message of messages) {
          const points = byConversation.get(message.conversation) ?? [];
          points.push({ x: x(message.time), y: y(message.from) });
          byConversation.set(message.conversation, points);
        }
        let edges = "";
        for (const [conversation, points] of byConversation) {
          for (let index = 0; index < points.length - 1; index += 1) {
            const from = points[index];
            const to = points[index + 1];
            const middle = (from.x + to.x) / 2;
            edges += `<path d="M${from.x.toFixed(1)} ${from.y.toFixed(
              1,
            )} C${middle.toFixed(1)} ${from.y.toFixed(
              1,
            )} ${middle.toFixed(1)} ${to.y.toFixed(1)} ${to.x.toFixed(
              1,
            )} ${to.y.toFixed(1)}" stroke="${colors.get(
              conversation,
            )}" fill="none" stroke-width="1.3" opacity=".45"/>`;
          }
        }

        const bands = lanes
          .map(
            (agent, index) =>
              `<rect x="0" y="${(y(agent) - laneHeight / 2).toFixed(
                0,
              )}" width="${width.toFixed(0)}" height="${laneHeight}" fill="${
                index % 2 ? "var(--color-canvas)" : "transparent"
              }"/><text x="8" y="${(y(agent) + 4).toFixed(
                0,
              )}" font-size="12" font-weight="600" fill="var(--color-secondary)">${escapeHtml(
                displayName(agent),
              )}</text>`,
          )
          .join("");
        let grid = "";
        for (let minute = 0; minute * 60 <= span; minute += 1) {
          const gridX = x(start + minute * 60000).toFixed(0);
          grid += `<line x1="${gridX}" y1="${
            marginY - laneHeight / 2
          }" x2="${gridX}" y2="${
            height - marginY + laneHeight / 2
          }" stroke="var(--color-rule)"/>`;
          grid += `<text x="${gridX}" y="${
            marginY - laneHeight / 2 - 6
          }" font-size="10" text-anchor="middle" fill="var(--color-secondary)">${minute}m</text>`;
        }
        const dots = messages
          .map((message) => {
            const href = routeHref(conditionId, runName, message.number);
            const dotX = x(message.time);
            const dotY = y(message.from);
            const selected = selectedMessage === message.number;
            const current = selected ? ' aria-current="location"' : "";
            const ariaLabel = `Message ${message.number} from ${
              message.from
            }: ${message.text}`;
            const number = `<text class="timeline-message-number" x="${dotX.toFixed(
              1,
            )}" y="${(dotY - radius - 5).toFixed(
              1,
            )}" text-anchor="middle">${message.number}</text>`;
            return `<a id="timeline-message-${
              message.number
            }" class="message-link" data-message-route data-message-number="${
              message.number
            }" data-message-from="${escapeHtml(
              displayName(message.from),
            )}" data-message-to="${escapeHtml(
              message.to.map(displayName).join(", ") || "Unknown recipient",
            )}" data-message-tooltip="${escapeHtml(
              message.text,
            )}" href="${escapeHtml(href)}" aria-label="${escapeHtml(
              ariaLabel,
            )}"${current}><circle class="message-hit-target" cx="${dotX.toFixed(
              1,
            )}" cy="${dotY.toFixed(
              1,
            )}" r="12"></circle><circle class="message-dot" cx="${dotX.toFixed(
              1,
            )}" cy="${dotY.toFixed(1)}" r="${radius}" fill="${colors.get(message.conversation)}" stroke="var(--color-surface)" stroke-width="1.2"></circle>${number}</a>`;
          })
          .join("");
        const taskConversations = conversations.filter(read.isTask);
        const legendItems = [];
        if (taskConversations.length > 0) {
          legendItems.push(
            `<span><i class="swatch" style="--swatch:${colors.get(
              taskConversations[0],
            )}"></i>${
              taskConversations.length === 1
                ? "scenario"
                : `${taskConversations.length} scenarios`
            }</span>`,
          );
        }
        for (const conversation of conversations.filter(
          (item) => !read.isTask(item) && !read.isPrincipal(item),
        )) {
          legendItems.push(
            `<span><i class="swatch" style="--swatch:${colors.get(
              conversation,
            )}"></i>${escapeHtml(label(conversation))}</span>`,
          );
        }
        return `<div class="conversation-key">${legendItems.join("")}</div>
          <div class="overflow-region"><svg class="timeline-plot" width="${width.toFixed(
            0,
          )}" height="${height.toFixed(
            0,
          )}" viewBox="0 0 ${width.toFixed(0)} ${height.toFixed(
            0,
          )}" role="img" aria-label="Agent-to-agent message timeline">${bands}${grid}<g>${edges}</g><g>${dots}</g></svg></div>`;
      }

      function renderMessages(read, conditionId, runName, selectedMessage) {
        const { colors, conversations, label, messages } = read;
        if (messages.length === 0) return activeRead?.messages.length
          ? '<p class="message-empty">No messages match these filters. <button type="button" data-clear-messages>Clear filters</button></p>'
          : '<p class="message-empty">No messages were recorded for this run.</p>';
        const columns = new Map(conversations.map((conversation, index) => [conversation, index + 2]));
        // Align task requests across conversation lanes while retaining source
        // order within each lane and in the DOM.
        const inputCounts = new Map();
        const inputRows = new Map();
        for (const message of messages.filter((message) => message.input)) {
          const index = inputCounts.get(message.conversation) ?? 0;
          inputRows.set(message.number, index + 2);
          inputCounts.set(message.conversation, index + 1);
        }
        const inputRowCount = Math.max(0, ...inputCounts.values());
        const rowCount = inputRowCount + messages.filter((message) => !message.input).length;
        let timedRow = inputRowCount + 2;
        const usedClocks = new Set();
        const columnBands = conversations.map((conversation, index) => index % 2 === 0 ? "" :
          `<div class="trace-column-band" aria-hidden="true" style="grid-column:${columns.get(conversation)};grid-row:1/${rowCount + 2}"></div>`).join("");
        const rowBands = Array.from({length: rowCount}, (_, index) => index % 2 === 0 ? "" :
          `<div class="trace-row-band" aria-hidden="true" style="grid-row:${index + 2}"></div>`).join("");
        const headings = [`<div class="trace-time trace-heading">Time</div>`, ...conversations.map((conversation) =>
          `<div class="trace-heading" style="border-top:3px solid ${colors.get(conversation)};grid-column:${columns.get(conversation)}"><button type="button" data-focus-conversation="${escapeHtml(conversation)}" title="Read this conversation">${escapeHtml(label(conversation))}<span aria-hidden="true"> ↗</span></button></div>`)];
        const cells = messages.map((message, index) => {
          const elapsed = Math.round((message.time - read.startTime) / 1000);
          const clock = Number.isFinite(message.time) ? `${elapsed < 0 ? "−" : ""}${Math.floor(Math.abs(elapsed) / 60)}:${String(Math.abs(elapsed) % 60).padStart(2, "0")}` : "";
          const row = message.input ? inputRows.get(message.number) : timedRow++;
          const clockCell = usedClocks.has(row) ? "" : `<div class="trace-time" style="grid-row:${row}">${message.input ? "Request" : clock || (message.principal ? "Reply" : "—")}</div>`;
          usedClocks.add(row);
          const href = routeHref(conditionId, runName, message.number);
          const timelineHref = routeHref(conditionId, runName, message.number, "timeline");
          const kind = message.input ? "Task request" : message.principal ? "Principal reply" : "Message";
          const body = `<div class="trace-message-body markdown-body">${message.text === "" ? '<p class="document-state">Empty reply.</p>' : renderMarkdown(message.text)}</div>`;
          const step = (offset) => {
            const neighbor = messages[index + offset];
            return neighbor ? `<a class="message-step" data-message-route href="${escapeHtml(routeHref(conditionId, runName, neighbor.number))}">${offset < 0 ? "← Previous" : "Next →"}</a>` : "";
          };
          return `${clockCell}<article id="message-${message.number}" class="trace-message${message.input ? " is-input" : ""}${message.initialization ? " is-initialization" : ""}${selectedMessage === message.number ? " is-selected" : ""}" style="grid-row:${row};grid-column:${columns.get(message.conversation)};--thread-color:${colors.get(message.conversation)}">
            <div class="trace-message-heading"><span>${escapeHtml(displayName(message.from))} <span class="sender-arrow">→</span> ${escapeHtml(message.to.map(displayName).join(", ") || "Unknown recipient")}</span><span class="message-heading-actions"><a class="message-permalink" data-message-route href="${escapeHtml(href)}" aria-label="Link to ${kind.toLowerCase()} ${message.number}">#${message.number}</a>${!message.principal && clock ? `<a data-message-route class="message-timeline-link" href="${escapeHtml(timelineHref)}">Timeline</a>` : ""}</span></div>
            <div class="message-clock">${kind}${clock ? ` <span aria-hidden="true">·</span> ${message.principal ? "Captured " : ""}${clock}` : ""}</div>
            ${message.initialization ? `<details><summary>${message.input ? "Initial instructions" : "Response to initial instructions"}</summary>${body}</details>` : body}
            <div class="message-links">${message.relatedNumber ? `<a data-message-route href="${escapeHtml(routeHref(conditionId, runName, message.relatedNumber))}">${message.input ? "Reply" : "Original input"} ${message.relatedNumber}</a>` : ""}<span class="message-steps">${step(-1)}${step(1)}</span></div>
          </article>`;
        });
        const focused = conversations.length === 1 && messageFilters.layout === "auto";
        const layoutClass = messageFilters.layout === "reading" || focused ? " reading-view" : messageFilters.layout === "swimlanes" ? " force-swimlanes" : "";
        const focusHeading = messageFilters.conversation ? `<div class="focused-thread"><h3>${escapeHtml(label(messageFilters.conversation))}</h3><button type="button" data-all-conversations>All conversations</button></div>` : "";
        return `${focusHeading}<div class="overflow-region" role="region" aria-label="Message transcript" tabindex="0"><div class="trace-grid${layoutClass}" style="grid-template-columns:3.5rem repeat(${conversations.length}, var(--trace-column-width))">${columnBands}${rowBands}${headings.join("")}${cells.join("")}</div></div>`;
      }

      // What each agent said back to its principal, one entry per gateway
      // message. Absent for runs recorded before the RunSpec emitted it.
      async function loadReplies(base, refresh = false) {
        try {
          const body = await loadText(`${base}/result/replies.json`, true, refresh);
          if (body === null) return { status: "missing" };
          const replies = JSON.parse(body);
          if (!Array.isArray(replies) || !replies.every((reply) =>
            reply && ["agent", "key", "text"].every((field) =>
              typeof reply[field] === "string",
            ),
          )) throw new Error("The principal reply file is malformed.");
          return { status: "available", replies };
        } catch (error) {
          return { status: "error", message: error.message };
        }
      }

      function principalReplyPhase(reply) {
        if (reply.key === `persona-${reply.agent}`) return "initialization";
        const prefix = `seed-${reply.agent}-`;
        if (reply.key.startsWith(prefix) && /^\d+$/.test(reply.key.slice(prefix.length))) {
          return "task";
        }
        return "other";
      }

      async function loadPrincipalInputs(base, refresh = false) {
        try {
          const body = await loadText(`${base}/inputs/principal-messages.json`, true, refresh);
          if (body === null) return { status: "missing" };
          const value = JSON.parse(body);
          if (!Array.isArray(value) || !value.every((request) =>
                request && ["agent", "key", "text"].every((field) => typeof request[field] === "string") &&
                (request.phase === "initialization" || request.phase === "task")) ||
              new Set(value.map((request) => JSON.stringify([request.agent, request.key]))).size !== value.length) {
            throw new Error("The principal input file is malformed.");
          }
          return { status: "available", requests: value };
        } catch (error) {
          return { status: "error", message: error.message };
        }
      }

      function renderReplyNote(data, row) {
        const base = `runs/${row.id}`;
        if (data.status === "missing") return "";
        if (data.status === "error") {
          return `<p class="document-state">Principal replies could not be loaded: ${escapeHtml(data.message)}</p><button type="button" data-retry-route>Retry this run</button>`;
        }
        if (!data.replies.some((reply) => principalReplyPhase(reply) !== "initialization")) return "";
        return `<p><a href="${escapeHtml(base)}/result/replies.json">Raw principal replies</a></p>`;
      }

      async function loadRunCore(base, refresh = false) {
        const [verdict, solution, transcript, replies, inputs] = await Promise.all([
          loadJson(`${base}/result/verdict.json`, refresh),
          loadJson(`${base}/solution.json`, refresh),
          loadJson(`${base}/result/transcript.json`, refresh),
          loadReplies(base, refresh),
          loadPrincipalInputs(base, refresh),
        ]);
        if (
          !verdict ||
          typeof verdict !== "object" ||
          typeof verdict.pass !== "boolean" ||
          !solution ||
          typeof solution !== "object" ||
          typeof solution.kind !== "string" ||
          !Array.isArray(transcript)
        ) {
          throw new Error(`${base} contains malformed core artifacts`);
        }
        return { inputs, replies, solution, transcript, verdict };
      }

      async function loadAgentDocuments(
        base,
        directory,
        agents,
        generation,
        refresh = false,
      ) {
        const documents = await Promise.all(
          agents.map(async (agent) => {
            const path = `${base}/${directory}/${encodeURIComponent(agent)}.md`;
            const body = await loadText(path, true, refresh);
            return { agent, body, path };
          }),
        );
        if (generation !== renderGeneration) return null;
        return documents;
      }

      function renderPersonaDocuments(documents, conditionId, runName) {
        return documents
          .map((document) => {
            const agentName = shortName(document.agent);
            const permalink = sectionHref(
              conditionId,
              runName,
              "instructions",
              agentName,
            );
            const rawLink =
              document.body === null
                ? ""
                : `<a href="${escapeHtml(document.path)}">Open raw file</a>`;
            const missingState =
              document.body === null
                ? '<p class="document-state">No persona file is present.</p>'
                : "";
            const body =
              document.body === null
                ? ""
                : `<div class="document-body markdown-body">${renderMarkdown(
                    document.body,
                  )}</div>`;
            return `<article class="document" id="instructions-${escapeHtml(
              agentName,
            )}">
              <div class="document-heading"><div class="document-title"><h3 tabindex="-1">${escapeHtml(
                `${document.agent}.md`,
              )}</h3><a class="section-anchor" href="${escapeHtml(
                permalink,
              )}" aria-label="Link to ${escapeHtml(
                agentName,
              )}'s persona">#</a></div>${rawLink}</div>
              ${missingState}
              ${body}
            </article>`;
          })
          .join("");
      }

      function renderConversationBrowser(read) {
        const item = (conversation, name, count) => `<button type="button" data-focus-conversation="${escapeHtml(conversation)}" aria-pressed="${conversation === ""}"${conversation ? ` style="--thread-color:${read.colors.get(conversation)}"` : ""}><span>${escapeHtml(name)}</span><small>${count}</small></button>`;
        const group = (principal) => read.conversations.filter((id) => read.isPrincipal(id) === principal).map((id) => item(id, read.label(id), read.messages.filter((message) => message.conversation === id).length)).join("");
        return `<h3>Conversations</h3>${item("", "All conversations", read.messages.length)}<h4>Between agents</h4>${group(false) || '<p class="document-state">None recorded</p>'}${read.conversations.some(read.isPrincipal) ? `<h4>With principals</h4>${group(true)}` : ""}`;
      }

      function renderPersonaPicker(documents, route) {
        return `<div class="persona-picker"><label for="persona-agent-select">Jump to agent
          <select id="persona-agent-select" data-persona-agent><option value="">Choose an agent</option>${documents.map((document) =>
            `<option value="${escapeHtml(document.agent)}"${route.sectionTarget === "instructions" && route.agentTarget === document.agent ? " selected" : ""}>${escapeHtml(displayName(document.agent))}</option>`).join("")}</select>
        </label></div>`;
      }

      function runEvidenceHref(candidate, route, calendarAgent) {
        const [conditionId, runName] = candidate.id.split("/");
        if (["calendar", "instructions"].includes(route.sectionTarget)) {
          const agent = route.sectionTarget === "calendar" ? calendarAgent : route.agentTarget;
          return sectionHref(conditionId, runName, route.sectionTarget,
            candidate.agents.includes(agent) ? shortName(agent) : null);
        }
        return route.sectionTarget === "outcome"
          ? sectionHref(conditionId, runName, "outcome")
          : routeHref(conditionId, runName);
      }

      function updateRunNavigation(route, calendarAgent) {
        const select = mainElement.querySelector("[data-run-select]");
        if (!select) return;
        const runs = route.condition.runs;
        const index = runs.findIndex((candidate) => candidate.id === route.row.id);
        for (const link of mainElement.querySelectorAll("[data-run-offset]")) {
          const candidate = runs[index + Number(link.dataset.runOffset)];
          if (candidate) link.href = runEvidenceHref(candidate, route, calendarAgent);
        }
        for (const [index, option] of [...select.options].entries()) {
          option.value = runEvidenceHref(runs[index], route, calendarAgent);
        }
      }

      function renderMessageControls(read) {
        const participants = [...new Set(read.messages.flatMap((message) => [message.from, ...message.to]))].sort();
        return `<div class="message-controls">
          <label>Search messages<input type="search" data-message-search placeholder="Search this run"></label>
          <details class="message-options"${window.matchMedia("(max-width: 767px)").matches ? "" : " open"}><summary>Filters and layout</summary><div>
          <label>Participant<select data-message-participant><option value="">Everyone</option>${participants.map((name) => `<option value="${escapeHtml(name)}">${escapeHtml(displayName(name))}</option>`).join("")}</select></label>
          <label class="conversation-control">Conversation<select data-message-conversation><option value="">All conversations</option>${read.conversations.map((id) => `<option value="${escapeHtml(id)}">${escapeHtml(read.label(id))}</option>`).join("")}</select></label>
          <label class="layout-control">View<select data-message-layout><option value="reading">Chronological list</option><option value="swimlanes">Conversation lanes</option></select></label>
          </div></details>
          <button type="button" data-clear-messages hidden>Clear filters</button>
        </div>`;
      }

      function updateMessages() {
        if (!activeRead || !activeRun) return;
        const terms = messageFilters.search.trim().toLowerCase().split(/\s+/).filter(Boolean);
        const messages = activeRead.messages.filter((message) =>
          (!messageFilters.participant || [message.from, ...message.to].includes(messageFilters.participant)) &&
          (!messageFilters.conversation || message.conversation === messageFilters.conversation) &&
          terms.every((term) => message.text.toLowerCase().includes(term)),
        );
        const visibleConversations = new Set(messages.map((message) => message.conversation));
        const read = { ...activeRead, messages, conversations: activeRead.conversations.filter((id) => visibleConversations.has(id)) };
        const [conditionId, runName] = activeRun.row.id.split("/");
        const currentRoute = parseRoute(window.location.hash);
        const selected = currentRoute.kind === "run" ? currentRoute.messageNumber : null;
        mainElement.querySelector("[data-message-transcript]").innerHTML = renderMessages(read, conditionId, runName, selected);
        mainElement.querySelector("[data-message-timeline]").innerHTML = renderTimeline(read, conditionId, runName, selected);
        const wire = messages.filter((message) => !message.principal).length;
        const inputs = messages.filter((message) => message.input).length;
        const replies = messages.length - wire - inputs;
        const counts = [`${wire} messages`, ...(inputs ? [`${inputs} task ${inputs === 1 ? "request" : "requests"}`] : []), ...(replies ? [`${replies} principal ${replies === 1 ? "reply" : "replies"}`] : [])];
        mainElement.querySelector("[data-message-count]").textContent = `${messages.length !== activeRead.messages.length ? `${messages.length} of ${activeRead.messages.length} entries · ` : ""}${counts.join(" · ")}`;
        mainElement.querySelector(".message-controls [data-clear-messages]").hidden = !terms.length && !messageFilters.participant && !messageFilters.conversation;
        const workspace = mainElement.querySelector(".message-workspace");
        if (workspace) workspace.classList.toggle("is-lanes", messageFilters.layout === "swimlanes");
        for (const button of mainElement.querySelectorAll(".conversation-browser [data-focus-conversation]")) {
          button.setAttribute("aria-pressed", String(button.dataset.focusConversation === messageFilters.conversation));
        }
        hideMessageTooltip();
      }

      function clearMessageFilters() {
        messageFilters = { ...messageFilters, search: "", participant: "", conversation: "" };
        for (const name of ["search", "participant", "conversation"]) {
          const control = mainElement.querySelector(`[data-message-${name}]`);
          if (control) control.value = "";
        }
        updateMessages();
      }

      function renderRun(route, core, finalDocuments, initialCalendarDocuments, personaDocuments, read) {
        const { condition, row } = route;
        const { solution, verdict } = core;
        if (verdict.pass !== row.pass) throw new Error(`${row.id}: index and verdict outcomes disagree`);
        const runName = row.id.split("/")[1];
        const cell = cellResults.get(condition.id);
        const translated = translateOutcome(verdict, solution, finalDocuments);
        const owner = solution.allocatorId ?? solution.targetId;
        const defaultDocument = finalDocuments.find((document) => document.agent === owner) ?? finalDocuments[0];
        const selectedDocument = finalDocuments.find((document) => document.agent === (route.sectionTarget === "calendar" ? route.agentTarget : null)) ?? defaultDocument;
        const calendar = renderCalendarViewer(row, finalDocuments, initialCalendarDocuments, selectedDocument?.agent, defaultDocument?.agent);
        const calendarAnchor = selectedDocument ? `<a class="section-anchor" data-calendar-section-link href="${escapeHtml(sectionHref(condition.id, runName, "calendar", shortName(selectedDocument.agent)))}" aria-label="Link to ${escapeHtml(shortName(selectedDocument.agent))}'s rendered calendar">#</a>` : "";
        const runIndex = condition.runs.findIndex((candidate) => candidate.id === row.id);
        const neighbor = (offset) => {
          const candidate = condition.runs[runIndex + offset];
          return candidate ? `<a data-run-offset="${offset}" href="${escapeHtml(runEvidenceHref(candidate, route, selectedDocument?.agent))}" aria-label="${offset < 0 ? "Previous" : "Next"} run">${offset < 0 ? "←" : "→"}</a>` : `<span class="run-arrow-placeholder" aria-hidden="true"></span>`;
        };
        const title = `${condition.experiment} · ${conditionLabel(condition)}${condition.n !== null ? ` · N = ${condition.n}` : ""}`;
        const base = `runs/${row.id}`;
        const detailList = translated.details.length ? `<ul class="finding-list">${translated.details.map((detail) => `<li>${escapeHtml(detail)}</li>`).join("")}</ul>` : "";
        const replyNote = renderReplyNote(core.replies, row);
        activeRead = read;
        activeRun = route;
        messageFilters = { search: "", participant: "", conversation: "", layout: messageFilters.layout };
        document.title = `${title} · ${runName} | Social Harness`;
        mainElement.innerHTML = `<nav class="route-nav" aria-label="Breadcrumb"><a href="#">All experiments</a><span aria-hidden="true">/</span><span>${condition.experiment}</span></nav>
          <h1 class="run-title">${escapeHtml(title)}</h1>
          <div class="run-facts"><span><b>${settingLabel(condition)}</b> · ${condition.messagingMode === "shared" ? "Shared context" : "Isolated context"}</span><span><b>${modelConfiguration(cell)}</b> · ${escapeHtml(modelDescription(cell))}</span></div>
          <details class="run-source"><summary>Run details and source files</summary>
            <p>${escapeHtml(scenarioDescription(condition))} ${escapeHtml(populationLabel(row))}</p>
            <p>${escapeHtml(EXPERIMENTS[row.experiment])}</p><p><code>${escapeHtml(row.id)}</code></p>
            <p><a href="${base}/result/transcript.json">Raw transcript</a> · <a href="${base}/result/verdict.json">Grader result</a> · <a href="${base}/solution.json">Task specification</a></p>
            ${replyNote}
          </details>
          <div class="run-summary">
            <div class="run-topline"><section class="outcome-block" id="outcome" aria-labelledby="outcome-heading"><h2 class="outcome-line" id="outcome-heading"><span class="current-outcome"><span class="result-label ${outcomeClass(row)}">${outcomeLabel(row)}</span></span><span class="outcome-summary">${escapeHtml(translated.headline)}</span> <a class="section-anchor" href="${escapeHtml(sectionHref(condition.id, runName, "outcome"))}" aria-label="Link to outcome">#</a></h2></section>
              <div class="run-picker">${neighbor(-1)}<label>Run<select data-run-select aria-label="Choose a run">${condition.runs.map((candidate, index) => `<option value="${escapeHtml(runEvidenceHref(candidate, route, selectedDocument?.agent))}"${candidate.id === row.id ? " selected" : ""}>${String(index + 1).padStart(2, "0")} / ${condition.runs.length} · ${outcomeLabel(candidate)}</option>`).join("")}</select></label>${neighbor(1)}</div></div>
            <nav class="run-sections" aria-label="Run evidence">${[["trace", "Messages"], ["calendar", "Calendars"], ["instructions", "Personas"]].map(([section, label]) => `<a data-evidence-view="${section}" href="${escapeHtml(sectionHref(condition.id, runName, section))}">${label}</a>`).join("")}<button type="button" data-copy-link>Copy link</button></nav>
          </div>
          <div class="evidence-surface">
            ${detailList}
            <section class="dossier-section" id="trace" data-view="trace">
              <h2 class="sr-only">Messages</h2>
              ${renderMessageControls(read)}
              <div class="trace-tools"><p class="message-count" data-message-count aria-live="polite"></p><button type="button" data-toggle-timeline aria-expanded="false" aria-controls="timeline-overview">Show timeline</button></div>
              <details class="timeline-disclosure" id="timeline-overview"><summary hidden>Timeline overview</summary><details class="timeline-key"><summary>How to read this trace</summary><p>Each dot is an agent-to-agent message. Lines connect successive messages in the same conversation. Time is relative to the first send.</p></details><div data-message-timeline></div></details>
              <div class="message-workspace"><aside class="conversation-browser" aria-label="Conversations">${renderConversationBrowser(read)}</aside><div data-message-transcript></div></div>
            </section>
            <section class="dossier-section" id="calendar-evidence" data-view="calendar" hidden><div class="section-heading"><h2>Calendars</h2>${calendarAnchor}</div>${calendar}</section>
            <section class="dossier-section" id="instructions" data-view="instructions" hidden><div class="section-heading"><h2>Agent personas</h2><a class="section-anchor" href="${escapeHtml(sectionHref(condition.id, runName, "instructions"))}" aria-label="Link to agent personas">#</a></div>${renderPersonaPicker(personaDocuments, route)}${renderPersonaDocuments(personaDocuments, condition.id, runName)}</section>
          </div>`;
        mainElement.dataset.runId = row.id;
        mainElement.querySelector("[data-message-layout]").value = messageFilters.layout;
        updateMessages();
        updateRunNavHeight();
      }

      function updateRunNavHeight() {
        const header = mainElement.querySelector(".run-summary");
        if (header) mainElement.style.setProperty("--run-nav-height", `${header.getBoundingClientRect().height}px`);
      }

      function focusMessageTarget(route) {
        if (route.messageNumber !== null && !document.getElementById(`message-${route.messageNumber}`) &&
            activeRead?.messages.some((message) => message.number === route.messageNumber)) {
          clearMessageFilters();
        }
        for (const message of mainElement.querySelectorAll(
          ".trace-message.is-selected",
        )) {
          message.classList.remove("is-selected");
        }
        for (const link of mainElement.querySelectorAll(
          ".message-link[aria-current]",
        )) {
          link.removeAttribute("aria-current");
        }
        if (route.messageNumber === null) return;

        const traceMessage = document.getElementById(
          `message-${route.messageNumber}`,
        );
        const timelineMessage = document.getElementById(
          `timeline-message-${route.messageNumber}`,
        );
        traceMessage?.classList.add("is-selected");
        for (const detail of traceMessage?.querySelectorAll("details") ?? []) {
          detail.open = true;
        }
        timelineMessage?.setAttribute("aria-current", "location");
        if (route.messageTarget === "timeline" && timelineMessage) {
          const overview = timelineMessage.closest("details");
          if (overview) overview.open = true;
          const overflow = timelineMessage.closest(".overflow-region");
          const circle = timelineMessage.querySelector("circle");
          const center = Number(circle?.getAttribute("cx"));
          if (overflow && Number.isFinite(center)) {
            overflow.scrollLeft = Math.max(
              0,
              center - overflow.clientWidth / 2,
            );
            const laneCenter = Number(circle?.getAttribute("cy"));
            if (Number.isFinite(laneCenter)) overflow.scrollTop = Math.max(0, laneCenter - overflow.clientHeight / 2);
            overflow.scrollIntoView({ block: "start" });
          } else {
            timelineMessage.scrollIntoView({
              block: "center",
              inline: "center",
            });
          }
        } else {
          traceMessage?.scrollIntoView({ block: "start", inline: "center" });
        }
      }

      function fitCalendarLabels() {
        for (const calendar of mainElement.querySelectorAll(".calendar")) {
          if (!calendar.getClientRects().length) continue;
          // Preserve one time scale for every day, event, and hour marker.
          calendar.style.setProperty("--calendar-scale", "1");
          let scale = 1;
          for (const event of calendar.querySelectorAll(".calendar-event")) {
            if (event.scrollHeight <= event.clientHeight) continue;
            const style = getComputedStyle(event);
            const borders = parseFloat(style.borderTopWidth) + parseFloat(style.borderBottomWidth);
            scale = Math.max(scale, (event.scrollHeight + borders + 1) / (event.getBoundingClientRect().height + 1));
          }
          calendar.style.setProperty("--calendar-scale", String(Math.ceil(scale * 100) / 100));
        }
      }

      function showCalendarAgent(requestedAgent) {
        const select = mainElement.querySelector("[data-calendar-agent]");
        if (!(select instanceof HTMLSelectElement)) return null;
        const available = [...select.options].map((option) => option.value);
        const defaultAgent = select.getAttribute(
          "data-calendar-default-agent",
        );
        const agent = available.includes(requestedAgent)
          ? requestedAgent
          : available.includes(defaultAgent)
            ? defaultAgent
            : available[0];
        if (!agent) return null;

        select.value = agent;
        for (const view of mainElement.querySelectorAll(
          "[data-calendar-agent-view]",
        )) {
          view.hidden = view.getAttribute("data-calendar-agent-view") !== agent;
        }
        const [conditionId, runName] = (
          mainElement.dataset.runId ?? ""
        ).split("/");
        const permalink = mainElement.querySelector(
          "[data-calendar-section-link]",
        );
        if (conditionId && runName && permalink instanceof HTMLAnchorElement) {
          permalink.setAttribute(
            "href",
            sectionHref(
              conditionId,
              runName,
              "calendar",
              shortName(agent),
            ),
          );
          permalink.setAttribute(
            "aria-label",
            `Link to ${shortName(agent)}'s rendered calendar`,
          );
        }
        fitCalendarLabels();
        return agent;
      }

      function focusSectionTarget(route, scroll = true) {
        for (const entry of mainElement.querySelectorAll(".calendar-event.is-selected")) entry.classList.remove("is-selected");
        const view = ["calendar", "instructions"].includes(route.sectionTarget) ? route.sectionTarget : "trace";
        for (const section of mainElement.querySelectorAll("[data-view]")) {
          section.hidden = section.dataset.view !== view;
        }
        for (const link of mainElement.querySelectorAll("[data-evidence-view]")) {
          if (link.dataset.evidenceView === view) link.setAttribute("aria-current", "page");
          else link.removeAttribute("aria-current");
        }
        for (const link of mainElement.querySelectorAll(
          '.section-anchor[aria-current="location"]',
        )) {
          link.removeAttribute("aria-current");
        }

        const calendarAgent =
          route.sectionTarget === "calendar" ? route.agentTarget : null;
        const selectedCalendarAgent = showCalendarAgent(calendarAgent);
        updateRunNavigation(route, selectedCalendarAgent);
        const personaSelect = mainElement.querySelector("[data-persona-agent]");
        if (personaSelect) personaSelect.value = route.sectionTarget === "instructions" ? route.agentTarget ?? "" : "";
        if (route.calendarChange) {
          const target = document.getElementById(`calendar-${shortName(route.agentTarget)}-change-${route.calendarChange}`);
          if (!target) {
            renderInvalidRoute({
              message: `Calendar change ${route.calendarChange} was not found for ${displayName(route.agentTarget)} in this run.`,
              parentHref: sectionHref(route.condition.id, route.row.id.split("/")[1], "calendar", shortName(route.agentTarget)),
              parentLabel: "Return to this calendar",
            });
            return;
          }
          target.classList.add("is-selected");
          fitCalendarLabels();
          if (scroll) {
            target.focus({ preventScroll: true });
            target.scrollIntoView({ block: "start", inline: "center" });
          }
          return;
        }
        if (route.sectionTarget === null) return;

        const targetId =
          route.sectionTarget === "calendar"
            ? "calendar-evidence"
            : route.sectionTarget === "instructions" && route.agentTarget
              ? `instructions-${shortName(route.agentTarget)}`
              : route.sectionTarget;
        const target = document.getElementById(targetId);
        for (const link of mainElement.querySelectorAll(".section-anchor")) {
          if (link.getAttribute("href") === window.location.hash) {
            link.setAttribute("aria-current", "location");
          }
        }
        if (scroll) {
          target?.scrollIntoView({ block: "start" });
          if (route.sectionTarget === "instructions" && route.agentTarget) {
            target?.querySelector("h3")?.focus({ preventScroll: true });
          }
        }
      }

      function renderRunError(route, error) {
        delete mainElement.dataset.runId;
        console.error(error);
        const base = `runs/${route.row.id}`;
        document.title = `Could not load ${route.row.id} | Trace viewer`;
        mainElement.innerHTML = `<nav class="route-nav" aria-label="Breadcrumb">
          <a href="#">All experiments</a><span aria-hidden="true">/</span>
          <span>${escapeHtml(route.condition.id)}</span><span aria-hidden="true">/</span>
          <span>${escapeHtml(route.row.id.split("/")[1])}</span>
        </nav>
        <section class="error-state">
          <h2>Could not load this run</h2>
          <p>The dossier at <code>${escapeHtml(
            base,
          )}</code> did not load as a complete release artifact.</p>
          <p>Try loading it again, or return to the experiment list to open another run.</p>
          ${window.location.protocol === "file:" ? '<p>For a downloaded release, serve the directory with <code>python3 -m http.server</code> and open it over HTTP.</p>' : ""}
          <button type="button" data-retry-route>Retry this run</button>
        </section>`;
      }

      async function renderRunRoute(route, generation, refresh = false) {
        delete mainElement.dataset.runId;
        mainElement.innerHTML = `<p class="status">Loading ${escapeHtml(
          route.row.id,
        )}…</p>`;
        const base = `runs/${route.row.id}`;
        try {
          const [
            core,
            finalDocuments,
            initialCalendarDocuments,
            personaDocuments,
          ] = await Promise.all([
            loadRunCore(base, refresh),
            loadAgentDocuments(
              base,
              "result/calendars",
              route.row.agents,
              generation,
              refresh,
            ),
            loadAgentDocuments(
              base,
              "inputs/calendars",
              route.row.calendarProvisioned,
              generation,
              refresh,
            ),
            loadAgentDocuments(
              base,
              "inputs/personas",
              route.row.agents,
              generation,
              refresh,
            ),
          ]);
          if (
            generation !== renderGeneration ||
            finalDocuments === null ||
            initialCalendarDocuments === null ||
            personaDocuments === null
          ) {
            return;
          }
          const read = readTranscript(core.transcript, core.replies, core.inputs);
          // Existing bootstrap links now resolve to the corresponding persona.
          const sourceId = /^([QP])(\d+)$/.exec(String(route.messageNumber));
          if (sourceId) {
            const source = sourceId[1] === "Q" ? core.inputs.requests?.[Number(sourceId[2]) - 1] : core.replies.replies?.[Number(sourceId[2]) - 1];
            const bootstrap = source && (sourceId[1] === "Q" ? source.phase === "initialization" : principalReplyPhase(source) === "initialization");
            if (bootstrap && route.row.agents.includes(source.agent)) {
              route = { ...route, messageNumber: null, messageTarget: null, sectionTarget: "instructions", agentTarget: source.agent };
              window.history.replaceState(null, "", sectionHref(route.condition.id, route.row.id.split("/")[1], "instructions", shortName(source.agent)));
            }
          }
          if (
            route.messageNumber !== null &&
            !read.messages.some((message) => message.number === route.messageNumber)
          ) {
            if (generation !== renderGeneration) return;
            renderInvalidRoute({
              message: `${route.row.id} has no message ${route.messageNumber}.`,
              parentHref: routeHref(
                route.condition.id,
                route.row.id.split("/")[1],
              ),
              parentLabel: `Return to ${route.row.id.split("/")[1]}`,
            });
            return;
          }

          renderRun(
            route,
            core,
            finalDocuments,
            initialCalendarDocuments,
            personaDocuments,
            read,
          );
          if (generation !== renderGeneration) return;
          focusSectionTarget(route);
          focusMessageTarget(route);
          if (!route.sectionTarget && route.messageNumber === null) window.scrollTo(0, 0);
        } catch (error) {
          if (generation !== renderGeneration) return;
          renderRunError(route, error);
        }
      }

      function dispatchRoute(refresh = false) {
        if (!releaseIndex) return;
        hideMessageTooltip();
        const generation = ++renderGeneration;
        let route = parseRoute(window.location.hash);
        // Keep existing principal citations usable after removing principal lanes.
        if (route.kind === "run" && route.messageTarget === "timeline" && typeof route.messageNumber === "string") {
          route = { ...route, messageTarget: "message" };
          window.history.replaceState(null, "", routeHref(route.condition.id, route.row.id.split("/")[1], route.messageNumber));
        }
        if (route.kind === "index") {
          delete mainElement.dataset.runId;
          renderIndex();
        } else if (route.kind === "run") {
          const messageExists =
            route.messageNumber === null ||
            Boolean(
              activeRead?.messages.some((message) => message.number === route.messageNumber),
            );
          if (
            !refresh &&
            mainElement.dataset.runId === route.row.id &&
            messageExists
          ) {
            focusSectionTarget(route);
            focusMessageTarget(route);
            return;
          }
          void renderRunRoute(route, generation, refresh);
        } else {
          renderInvalidRoute(route);
        }
      }

      async function loadReleaseIndex(refresh = false) {
        const generation = ++renderGeneration;
        delete mainElement.dataset.runId;
        mainElement.innerHTML = `<p class="status">Loading release index…</p>`;
        try {
          const [value, results] = await Promise.all([
            loadJson("index.json", refresh),
            loadJson("results.json", refresh),
          ]);
          if (generation !== renderGeneration) return;
          releaseIndex = decodeReleaseIndex(value);
          cellResults = decodeResults(results, releaseIndex.runs);
          conditions = buildConditions(releaseIndex.runs);
          dispatchRoute();
        } catch (error) {
          if (generation !== renderGeneration) return;
          console.error(error);
          mainElement.innerHTML = `<section class="error-state">
            <h2>Could not load the release index</h2>
            <p>The experiment list could not be loaded. Check your connection and try again.</p>
            ${window.location.protocol === "file:" ? '<p>For a downloaded release, serve the directory with <code>python3 -m http.server</code> and open it over HTTP.</p>' : ""}
            <button type="button" data-retry-index>Retry</button>
          </section>`;
        }
      }

      mainElement.addEventListener("pointerover", (event) => {
        const target = event.target;
        if (!(target instanceof Element)) return;
        const messageLink = target.closest("[data-message-tooltip]");
        if (!messageLink) return;
        const previousTarget = event.relatedTarget;
        if (
          previousTarget instanceof Node &&
          messageLink.contains(previousTarget)
        ) {
          return;
        }
        showMessageTooltip(messageLink);
      });
      mainElement.addEventListener("pointerout", (event) => {
        const target = event.target;
        if (!(target instanceof Element)) return;
        const messageLink = target.closest("[data-message-tooltip]");
        if (!messageLink) return;
        const nextTarget = event.relatedTarget;
        if (nextTarget instanceof Node && messageLink.contains(nextTarget)) {
          return;
        }
        if (nextTarget instanceof Node && tooltipElement.contains(nextTarget)) return;
        tooltipHideTimer = setTimeout(hideMessageTooltip, 180);
      });
      tooltipElement.addEventListener("pointerenter", () => clearTimeout(tooltipHideTimer));
      tooltipElement.addEventListener("pointerleave", hideMessageTooltip);
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") hideMessageTooltip();
      });
      mainElement.addEventListener("focusin", (event) => {
        const target = event.target;
        if (!(target instanceof Element)) return;
        const navigation = mainElement.querySelector(".run-summary");
        if (navigation && target.closest(".evidence-surface") && target.matches(":focus-visible") &&
            target.getBoundingClientRect().top < navigation.getBoundingClientRect().bottom + 8) {
          target.scrollIntoView({ block: "center" });
        }
        const messageLink = target.closest("[data-message-tooltip]");
        if (messageLink) showMessageTooltip(messageLink);
      });
      mainElement.addEventListener("focusout", (event) => {
        const target = event.target;
        if (!(target instanceof Element)) return;
        if (target.closest("[data-message-tooltip]")) hideMessageTooltip();
      });
      mainElement.addEventListener("click", (event) => {
        const target = event.target;
        if (!(target instanceof Element)) return;
        if (target.closest(".open-run")) saveIndexView();
        const evidenceLink = target.closest("[data-message-route], [data-calendar-change-link]");
        if (
          evidenceLink &&
          event instanceof MouseEvent &&
          event.button === 0 &&
          !event.altKey &&
          !event.ctrlKey &&
          !event.metaKey &&
          !event.shiftKey
        ) {
          const href = evidenceLink.getAttribute("href");
          if (!href) return;
          event.preventDefault();
          if (href !== window.location.hash) {
            window.history.pushState(null, "", href);
          }
          const route = parseRoute(window.location.hash);
          if (route.kind === "run") {
            focusSectionTarget(route, evidenceLink.hasAttribute("data-calendar-change-link"));
            focusMessageTarget(route);
          }
        } else if (target.closest("[data-toggle-timeline]")) {
          const overview = mainElement.querySelector(".timeline-disclosure");
          overview.open = !overview.open;
        } else if (target.closest("[data-focus-conversation]")) {
          messageFilters.conversation = target.closest("[data-focus-conversation]").dataset.focusConversation;
          messageFilters.layout = "reading";
          mainElement.querySelector("[data-message-conversation]").value = messageFilters.conversation;
          mainElement.querySelector("[data-message-layout]").value = "reading";
          updateMessages();
          mainElement.querySelector(".message-workspace")?.scrollIntoView({ block: "start" });
        } else if (target.closest("[data-all-conversations]")) {
          messageFilters.conversation = "";
          mainElement.querySelector("[data-message-conversation]").value = "";
          updateMessages();
        } else if (target.closest("[data-clear-index]")) {
          for (const selector of ["[data-index-search]", "[data-index-rq]", "[data-index-experiment]"]) {
            mainElement.querySelector(selector).value = "";
          }
          filterIndex();
          mainElement.querySelector("[data-index-search]").focus();
        } else if (target.closest("[data-clear-messages]")) {
          clearMessageFilters();
          mainElement.querySelector("[data-message-search]").focus();
        } else if (target.closest("[data-copy-link]")) {
          const button = target.closest("[data-copy-link]");
          navigator.clipboard?.writeText(window.location.href).then(() => {
            button.textContent = "Copied";
            setTimeout(() => { button.textContent = "Copy link"; }, 2000);
          }).catch(() => { button.textContent = "Copy URL from address bar"; });
          if (!navigator.clipboard) button.textContent = "Copy URL from address bar";
        } else if (target.closest("[data-retry-index]")) {
          void loadReleaseIndex(true);
        } else if (target.closest("[data-retry-route]")) {
          dispatchRoute(true);
        }
      });
      mainElement.addEventListener("change", (event) => {
        const target = event.target;
        if (!(target instanceof HTMLSelectElement)) return;
        if (target.matches("[data-run-select]")) {
          window.location.hash = target.value;
          return;
        }
        if (target.matches("[data-index-rq], [data-index-experiment]")) {
          filterIndex();
          return;
        }
        if (target.matches("[data-persona-agent]")) {
          const [conditionId, runName] = mainElement.dataset.runId.split("/");
          window.location.hash = sectionHref(conditionId, runName, "instructions", target.value ? shortName(target.value) : null);
          return;
        }
        for (const name of ["participant", "conversation", "layout"]) {
          if (target.matches(`[data-message-${name}]`)) {
            messageFilters[name] = target.value;
            updateMessages();
            return;
          }
        }
        if (!target.matches("[data-calendar-agent]")) return;
        const agent = showCalendarAgent(target.value);
        const [conditionId, runName] = (
          mainElement.dataset.runId ?? ""
        ).split("/");
        if (agent && conditionId && runName) {
          const href = sectionHref(
            conditionId,
            runName,
            "calendar",
            shortName(agent),
          );
          window.history.replaceState(null, "", href);
          const route = parseRoute(window.location.hash);
          if (route.kind === "run") focusSectionTarget(route, false);
        }
      });
      let messageSearchTimer;
      mainElement.addEventListener("toggle", (event) => {
        if (event.target.id !== "timeline-overview") return;
        const button = mainElement.querySelector("[data-toggle-timeline]");
        if (!button) return;
        button.setAttribute("aria-expanded", String(event.target.open));
        button.textContent = event.target.open ? "Hide timeline" : "Show timeline";
      }, true);
      mainElement.addEventListener("input", (event) => {
        const target = event.target;
        if (!(target instanceof HTMLInputElement)) return;
        if (target.matches("[data-index-search]")) filterIndex();
        if (target.matches("[data-message-search]")) {
          messageFilters.search = target.value;
          clearTimeout(messageSearchTimer);
          messageSearchTimer = setTimeout(updateMessages, 120);
        }
      });
      document.querySelector(".skip-link").addEventListener("click", (event) => {
        event.preventDefault();
        mainElement.focus();
        mainElement.scrollIntoView({ block: "start" });
      });
      window.addEventListener("hashchange", () => dispatchRoute());
      window.addEventListener("resize", hideMessageTooltip);
      window.addEventListener("resize", updateRunNavHeight);
      window.addEventListener("resize", fitCalendarLabels);
      void document.fonts.ready.then(() => {
        updateRunNavHeight();
        fitCalendarLabels();
        const route = parseRoute(window.location.hash);
        if (route.kind === "run" && route.calendarChange && mainElement.dataset.runId === route.row.id) focusSectionTarget(route);
      });
      window.matchMedia("(max-width: 767px)").addEventListener("change", (event) => {
        const options = mainElement.querySelector(".message-options");
        if (options) options.open = !event.matches;
      });
      window.addEventListener("scroll", hideMessageTooltip);
      // Save after scrolling settles instead of rewriting history on every frame.
      window.addEventListener("scroll", () => {
        clearTimeout(indexScrollSaveTimer);
        indexScrollSaveTimer = setTimeout(saveIndexView, 350);
      }, { passive: true });
      window.addEventListener("pagehide", saveIndexView);
      void loadReleaseIndex();
    </script>
  </body>
</html>
