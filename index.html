<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trace viewer | Agentic Societies Need a Social Harness</title>
    <style>
      @font-face {
        font-family: "Outfit"; font-style: normal; font-weight: 100 900;
        font-display: swap; src: url("assets/fonts/outfit-normal-700-latin.woff2") format("woff2");
      }
      @font-face {
        font-family: "Nunito"; font-style: normal; font-weight: 200 1000;
        font-display: swap; src: url("assets/fonts/nunito-normal-700-latin.woff2") format("woff2");
      }
      @font-face {
        font-family: "Nunito"; font-style: italic; font-weight: 200 1000;
        font-display: swap; src: url("assets/fonts/nunito-italic-400-latin.woff2") format("woff2");
      }
      :root {
        color-scheme: dark;

        --color-canvas: #0b0b0d;
        --color-surface: #141416;
        --color-ink: #ffffff;
        --color-secondary: #a2a2aa;
        --color-rule: #35353b;
        --color-brand: #0b0b0d;
        --color-brand-ink: #ffffff;
        --color-evidence: #b6cee9;
        --color-visited: #c7b5d8;
        --color-success: #7fcf9a;
        --color-failure: #f09d91;
        --color-raised: #1b1b1f;
        --color-selection: #1b1b1f;
        --color-booking: #9cbce2;

        --identity-1: #8cb7e8;
        --identity-2: #dfa572;
        --identity-3: #8bc89e;
        --identity-4: #e7939c;
        --identity-5: #b8a1de;
        --identity-6: #83c7c7;
        --identity-7: #d2bb7a;
        --identity-8: #d5a0c5;

        --font-display: "Outfit", sans-serif;
        --font-sans: "Nunito", sans-serif;
        --font-mono: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono",
          monospace;

        --text-caption: 0.75rem;
        --text-evidence: 0.8125rem;
        --text-secondary: 0.875rem;
        --text-body: 1rem;
        --text-section: 1.375rem;
        --text-outcome: 1rem;

        --space-1: 0.25rem;
        --space-2: 0.5rem;
        --space-3: 1rem;
        --space-4: 1.5rem;
        --space-5: 2.5rem;

        --radius-mark: 2px;
        --radius-control: 4px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--color-canvas);
        text-rendering: optimizeLegibility;
      }

      body {
        background: var(--color-canvas);
        color: var(--color-ink);
        font: var(--text-body) / 1.55 var(--font-sans);
        font-synthesis: none;
        margin: 0;
        overflow-x: hidden;
      }

      a {
        color: var(--color-evidence);
        text-decoration-thickness: 1px;
        text-underline-offset: 0.14em;
        transition:
          background-color 120ms ease,
          color 120ms ease,
          text-decoration-color 120ms ease;
      }

      a:visited {
        color: var(--color-visited);
      }

      a:hover {
        text-decoration-thickness: 2px;
      }

      a:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--color-evidence);
        outline-offset: 3px;
      }

      button {
        background: var(--color-surface);
        border: 1px solid var(--color-rule);
        border-radius: var(--radius-control);
        color: var(--color-ink);
        cursor: pointer;
        font: inherit;
        padding: var(--space-2) var(--space-3);
        transition:
          background-color 120ms ease,
          border-color 120ms ease,
          color 120ms ease;
      }

      button:hover {
        background: color-mix(
          in srgb,
          var(--color-evidence) 6%,
          var(--color-surface)
        );
        border-color: color-mix(
          in srgb,
          var(--color-evidence) 45%,
          var(--color-rule)
        );
      }

      code,
      pre,
      .mono {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
      }

      code {
        font-size: 0.9em;
        overflow-wrap: anywhere;
      }

      h1,
      h2,
      h3,
      p {
        margin-block-start: 0;
      }

      h1 {
        font-family: var(--font-display);
        font-size: 1.125rem;
        font-weight: 650;
        letter-spacing: -0.018em;
        line-height: 1.2;
        margin-block-end: var(--space-1);
      }

      h2 {
        font-family: var(--font-display);
        font-size: var(--text-section);
        font-weight: 620;
        letter-spacing: -0.012em;
        line-height: 1.25;
        margin-block-end: var(--space-3);
      }

      h3 {
        font-size: var(--text-body);
        line-height: 1.4;
        margin-block-end: var(--space-2);
      }

      pre {
        background: var(--color-surface);
        border: 1px solid var(--color-rule);
        border-radius: 0;
        font-size: var(--text-secondary);
        line-height: 1.5;
        margin: 0;
        max-width: 100%;
        overflow-x: auto;
        padding: var(--space-3);
        white-space: pre-wrap;
      }

      table {
        border-collapse: collapse;
        font-size: var(--text-secondary);
        width: 100%;
      }

      th,
      td {
        border-block-end: 1px solid var(--color-rule);
        padding: var(--space-2) var(--space-3);
        text-align: start;
        vertical-align: top;
      }

      th {
        color: var(--color-secondary);
        font-size: var(--text-caption);
        font-weight: 650;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      tbody tr {
        transition: background-color 120ms ease;
      }

      tbody tr:hover {
        background: color-mix(
          in srgb,
          var(--color-evidence) 4%,
          var(--color-surface)
        );
      }

      .page-shell {
        margin-inline: auto;
        max-width: 80rem;
        padding-inline: var(--space-4);
        width: 100%;
      }

      .site-header {
        background: var(--color-brand);
        border-block-end: 1px solid
          color-mix(in srgb, var(--color-brand-ink) 18%, var(--color-brand));
        color: var(--color-brand-ink);
        padding-block: var(--space-3);
      }

      .site-header h1 {
        margin: 0;
      }

      .route-nav,
      .sibling-runs {
        align-items: baseline;
        display: flex;
        flex-wrap: wrap;
        font-size: var(--text-secondary);
        gap: var(--space-2) var(--space-3);
      }

      .viewer-main {
        padding-block: var(--space-5);
      }

      .route-nav {
        color: var(--color-secondary);
        margin-block-end: var(--space-4);
      }

      .intro {
        margin-block-end: var(--space-5);
      }

      .intro p:last-child {
        margin-block-end: 0;
      }

      .intro > h2,
      .intro > p {
        max-width: 72ch;
      }

      .run-intro {
        margin-block-end: 0;
      }

      .run-intro .fact-grid {
        gap: 0 var(--space-3);
        grid-template-columns: repeat(auto-fit, minmax(8.5rem, 1fr));
        margin-block: var(--space-3) 0;
      }

      .run-intro .fact-grid div {
        border-block-start: 0;
        padding-block: var(--space-2);
      }

      .status,
      .overflow-cue,
      .document-state,
      .trace-note {
        color: var(--color-secondary);
        font-size: var(--text-secondary);
      }

      .condition-group + .condition-group,
      .dossier-section {
        border-block-start: 1px solid var(--color-rule);
        margin-block-start: var(--space-5);
        padding-block-start: var(--space-4);
      }

      .dossier-section {
        scroll-margin-block-start: var(--space-3);
      }

      .condition-table {
        min-width: 43rem;
      }

      .condition-table td:first-child {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
        font-weight: 600;
        white-space: nowrap;
      }

      .condition-table td:last-child {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .question-cell {
        max-width: 54ch;
      }

      .pass,
      .fail {
        font-weight: 720;
      }

      .pass {
        color: var(--color-success);
      }

      .fail {
        color: var(--color-failure);
      }

      .fact-grid {
        display: grid;
        gap: 0 var(--space-4);
        grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr));
        margin: var(--space-4) 0;
      }

      .fact-grid div {
        border-block-start: 1px solid var(--color-rule);
        padding-block: var(--space-2) var(--space-3);
      }

      .fact-grid dt {
        color: var(--color-secondary);
        font-size: var(--text-caption);
        font-weight: 620;
        letter-spacing: 0.055em;
        text-transform: uppercase;
      }

      .fact-grid dd {
        margin: var(--space-1) 0 0;
      }

      .sibling-runs {
        font-family: var(--font-sans);
        font-variant-numeric: tabular-nums;
        margin-block: var(--space-3) var(--space-4);
      }

      .sibling-runs [aria-current="page"] {
        color: var(--color-ink);
        font-weight: 700;
        text-decoration-thickness: 2px;
      }

      .outcome-block {
        margin-block: var(--space-4);
        scroll-margin-block-start: var(--space-3);
      }

      .result-label,
      .scenario-label {
        font-weight: 720;
        letter-spacing: 0.04em;
        margin-inline-end: var(--space-2);
      }

      .outcome-line,
      .scenario-line {
        font-family: var(--font-sans);
        font-size: var(--text-outcome);
        font-weight: 400;
        letter-spacing: 0;
        line-height: 1.5;
        margin: 0;
        max-width: 64rem;
      }

      .outcome-line .section-anchor {
        margin-inline-start: var(--space-1);
      }

      .intro > .scenario-line {
        max-width: none;
      }

      .section-heading,
      .document-title {
        align-items: baseline;
        display: flex;
        gap: var(--space-2);
      }

      .section-heading h2 {
        margin-block-end: 0;
      }

      .section-heading {
        margin-block-end: var(--space-3);
      }

      .section-anchor,
      .section-anchor:visited {
        color: var(--color-secondary);
        flex: none;
        font: 600 var(--text-caption) / 1 var(--font-mono);
        opacity: 0.72;
        text-decoration: none;
      }

      .section-anchor:hover,
      .section-anchor[aria-current="location"] {
        color: var(--color-evidence);
        opacity: 1;
        text-decoration: underline;
        text-underline-offset: 0.18em;
      }

      .finding-list {
        margin-block-end: 0;
        max-width: 68ch;
        padding-inline-start: 1.25rem;
      }

      .calendar-picker, .persona-picker {
        align-items: end;
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-2) var(--space-3);
        margin-block-end: var(--space-3);
      }

      .calendar-picker label, .persona-picker label {
        color: var(--color-secondary);
        display: grid;
        font-size: var(--text-caption);
        gap: var(--space-1);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .calendar-picker select, .persona-picker select {
        background: var(--color-surface);
        border: 1px solid var(--color-rule);
        border-radius: var(--radius-control);
        color: var(--color-ink);
        font: var(--text-body) / 1.4 var(--font-sans);
        min-width: 12rem;
        padding: var(--space-2) var(--space-3);
        transition:
          background-color 120ms ease,
          border-color 120ms ease;
      }

      .calendar-picker select:hover, .persona-picker select:hover {
        border-color: color-mix(
          in srgb,
          var(--color-evidence) 45%,
          var(--color-rule)
        );
      }

      .calendar-file-links,
      .calendar-key {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-2) var(--space-3);
      }

      .calendar-file-links {
        align-items: center;
        align-self: flex-end;
        font-size: var(--text-secondary);
        justify-content: flex-end;
        margin: 0 0 0 auto;
        min-height: 2.4rem;
        text-align: right;
      }

      .calendar-file-links[hidden] {
        display: none;
      }

      .calendar-key {
        color: var(--color-ink);
        font-size: var(--text-evidence);
        gap: var(--space-2) var(--space-4);
        grid-area: legend;
        justify-content: center;
        margin-block-start: var(--space-3);
      }

      .calendar-key span {
        align-items: center;
        display: inline-flex;
        gap: var(--space-1);
      }

      .calendar-key-mark {
        border-radius: var(--radius-mark);
        display: inline-block;
        height: 0.875rem;
        width: 0.875rem;
      }

      .calendar-key-mark.initial {
        background: var(--color-surface);
        border: 1px solid var(--color-rule);
      }

      .calendar-key-mark.added {
        background: color-mix(
          in srgb,
          var(--color-booking) 12%,
          var(--color-surface)
        );
        border: 1px solid var(--color-booking);
      }

      .calendar-key-mark.free {
        background: var(--color-canvas);
        border: 1px solid var(--color-success);
      }

      .calendar-evidence-layout {
        align-items: stretch;
        column-gap: var(--space-4);
        display: grid;
        grid-template-areas:
          "calendar log"
          "legend .";
        grid-template-columns: minmax(0, 1fr) 18rem;
        row-gap: 0;
      }

      .calendar-schedule {
        grid-area: calendar;
        min-height: 12rem;
        min-width: 0;
      }

      .calendar-log-column {
        grid-area: log;
        min-height: 0;
        position: relative;
      }

      .calendar-log {
        background: var(--color-surface);
        border: 1px solid var(--color-rule);
        inset: 0;
        overflow-y: auto;
        padding: var(--space-3);
        position: absolute;
        scrollbar-gutter: stable;
      }

      .calendar-log h3 {
        margin-block-end: var(--space-3);
      }

      .calendar-log ol {
        margin: 0;
        padding-inline-start: var(--space-4);
      }

      .calendar-log li {
        padding-inline-start: var(--space-1);
      }

      .calendar-log li + li {
        margin-block-start: var(--space-2);
      }

      .calendar-log code {
        font-size: var(--text-evidence);
        line-height: 1.45;
      }

      .overflow-region {
        max-width: 100%;
        overflow-x: auto;
        overscroll-behavior-inline: contain;
      }

      .overflow-cue {
        margin-block-end: var(--space-2);
      }

      @media (min-width: 48rem) {
        .narrow-only-cue {
          display: none;
        }
      }

      .calendar {
        align-items: flex-start;
        display: flex;
        gap: 2px;
        min-width: 48rem;
        padding-block: var(--space-2);
        width: max-content;
      }

      .calendar-gutter-column {
        flex: none;
        min-width: 3rem;
        width: 3rem;
      }

      .calendar-gutter {
        position: relative;
      }

      .calendar-hour {
        color: var(--color-secondary);
        font: var(--text-evidence) / 1 var(--font-mono);
        position: absolute;
        right: 0.4rem;
        transform: translateY(-50%);
      }

      .calendar-day:not(.calendar-gutter-column) {
        flex: 1 1 10rem;
        min-width: 10rem;
      }

      .calendar-day-heading {
        min-height: 30px;
        font-size: var(--text-secondary);
        font-weight: 680;
        letter-spacing: 0.015em;
        padding-block-end: var(--space-2);
        text-align: center;
      }

      .calendar-column {
        background: var(--color-canvas);
        border: 1px solid var(--color-rule);
        position: relative;
      }

      .calendar-line {
        border-block-start: 1px solid var(--color-rule);
        left: 0;
        position: absolute;
        right: 0;
      }

      .calendar-event {
        border-radius: var(--radius-mark);
        font-size: var(--text-evidence);
        left: 2px;
        line-height: 1.3;
        overflow: hidden;
        overflow-wrap: anywhere;
        padding: 1px 5px;
        position: absolute;
        right: 2px;
        transition:
          background-color 120ms ease,
          border-color 120ms ease,
          color 120ms ease;
      }

      .calendar-event.initial {
        background: var(--color-surface);
        border: 1px solid var(--color-rule);
        color: var(--color-secondary);
      }

      .calendar-event.added {
        background: color-mix(
          in srgb,
          var(--color-booking) 12%,
          var(--color-surface)
        );
        border: 1px solid var(--color-booking);
        color: var(--color-booking);
        font-weight: 700;
      }

      .calendar-event.free {
        background: var(--color-canvas);
        border: 1px dashed var(--color-success);
        color: var(--color-success);
        font-style: italic;
      }

      .calendar-event.removed, .calendar-key-mark.removed {
        background: color-mix(in srgb, var(--color-failure) 8%, var(--color-canvas));
        border: 1px dashed var(--color-failure);
        color: var(--color-failure);
      }
      .calendar-event.removed .event-label { text-decoration: line-through; }

      .conversation-key {
        color: var(--color-secondary);
        display: flex;
        flex-wrap: wrap;
        font-size: var(--text-caption);
        gap: var(--space-1) var(--space-3);
        margin-block-end: var(--space-2);
      }

      .conversation-key span {
        align-items: center;
        display: inline-flex;
        gap: 0.375rem;
      }

      .swatch {
        background: var(--swatch);
        border-radius: var(--radius-mark);
        height: 0.7rem;
        width: 0.7rem;
      }

      .timeline-plot {
        background: color-mix(
          in srgb,
          var(--color-surface) 82%,
          var(--color-canvas)
        );
        border: 1px solid
          color-mix(in srgb, var(--color-rule) 85%, var(--color-ink));
        display: block;
      }

      .message-link {
        cursor: pointer;
      }

      .message-hit-target {
        fill: transparent;
        pointer-events: all;
      }

      .message-link:focus-visible .message-dot {
        outline: 2px solid var(--color-evidence);
        outline-offset: 2px;
      }

      .message-link[aria-current='location'] .message-dot {
        stroke: var(--color-evidence);
        stroke-width: 4px;
      }

      .message-tooltip {
        background: var(--color-surface);
        border: 1px solid var(--color-rule);
        box-shadow: 0 0.75rem 2rem
          color-mix(in srgb, var(--color-ink) 18%, transparent);
        font-size: var(--text-body);
        line-height: 1.5;
        max-height: calc(100vh - 2rem);
        max-width: min(32rem, calc(100vw - 2rem));
        min-width: min(20rem, calc(100vw - 2rem));
        overflow-y: auto;
        padding: 0.75rem 0.875rem;
        pointer-events: auto;
        position: fixed;
        border-radius: var(--radius-control);
        width: max-content;
        z-index: 20;
      }

      .message-tooltip[hidden] {
        display: none;
      }

      .message-tooltip-label {
        color: var(--color-secondary);
        font-size: var(--text-caption);
        font-weight: 700;
        letter-spacing: 0.05em;
        margin-block-end: var(--space-2);
        text-transform: uppercase;
      }

      .message-tooltip-route {
        color: var(--color-secondary);
        font-size: var(--text-secondary);
        font-weight: 650;
        margin-block-end: var(--space-2);
        overflow-wrap: anywhere;
      }

      .timeline-message-number {
        display: none;
        fill: var(--color-ink);
        font: 700 10px var(--font-mono);
        paint-order: stroke;
        pointer-events: none;
        stroke: var(--color-surface);
        stroke-width: 3px;
      }

      .message-link[aria-current='location'] .timeline-message-number {
        display: inline;
      }

      .trace-grid {
        --trace-background: color-mix(
          in srgb,
          var(--color-surface) 82%,
          var(--color-canvas)
        );
        --trace-column-gap: 0.625rem;
        --trace-column-width: 18.75rem;

        align-items: start;
        background: var(--trace-background);
        display: grid;
        gap: 0.375rem var(--trace-column-gap);
        grid-auto-rows: min-content;
        min-width: max-content;
        padding-block-end: var(--space-1);
      }

      .trace-column-band {
        align-self: stretch;
        background: var(--color-canvas);
        pointer-events: none;
      }

      .trace-row-band {
        align-self: stretch;
        background: repeating-linear-gradient(
          to right,
          var(--color-canvas) 0 var(--trace-column-width),
          transparent var(--trace-column-width)
            calc(var(--trace-column-width) + var(--trace-column-gap)),
          var(--trace-background)
            calc(var(--trace-column-width) + var(--trace-column-gap))
            calc(
              var(--trace-column-width) + var(--trace-column-gap) +
                var(--trace-column-width)
            ),
          transparent
            calc(
              var(--trace-column-width) + var(--trace-column-gap) +
                var(--trace-column-width)
            )
            calc(
              var(--trace-column-width) + var(--trace-column-gap) +
                var(--trace-column-width) + var(--trace-column-gap)
            )
        );
        grid-column: 2 / -1;
        pointer-events: none;
      }

      .trace-heading {
        background: color-mix(
          in srgb,
          var(--color-surface) 76%,
          var(--color-canvas)
        );
        color: var(--color-secondary);
        font-size: var(--text-caption);
        font-weight: 650;
        grid-row: 1;
        padding: 0.45rem 0.125rem;
        position: sticky;
        top: 0;
        z-index: 2;
      }

      .trace-time {
        background: var(--trace-background);
        color: var(--color-secondary);
        font: var(--text-caption) / 1.4 var(--font-mono);
        grid-column: 1;
        left: 0;
        padding-block-start: var(--space-2);
        position: sticky;
        z-index: 1;
      }

      .trace-time.is-banded {
        background: var(--color-canvas);
      }

      .trace-message {
        border-block-start: 1px solid var(--color-rule);
        border-inline-start: 3px solid var(--thread-color);
        overflow-wrap: anywhere;
        padding: var(--space-2) var(--space-3);
        transition:
          background-color 120ms ease,
          outline-color 120ms ease;
      }

      .trace-message:hover {
        background: color-mix(
          in srgb,

          --color-success: #2c6a4b; --color-failure: #a13c30; --color-booking: #225b87;
          --identity-1: #1b5eaa; --identity-2: #9c3f00; --identity-3: #277a3f;
          --identity-4: #a02f3f; --identity-5: #6b4c9a; --identity-6: #006c72;

  <body>
    <a class="skip-link" href="#viewer-main">Skip to evidence</a>
    <header class="site-header">
      <nav class="page-shell site-nav" aria-label="Social Harness">
        <a class="site-brand" href="https://social-harness.org/" aria-label="Social Harness home"><svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true"><g stroke="currentColor" stroke-width="1.9" fill="none"><circle cx="11.5" cy="16" r="7"/><circle cx="20.5" cy="16" r="7"/></g><path d="M16,10.2 A7,7 0 0 1 16,21.8 A7,7 0 0 1 16,10.2 Z" fill="currentColor" opacity=".35"/></svg>Social Harness</a>
        <div class="site-links"><a href="https://social-harness.org/blog/agentic-societies-need-a-social-harness/">Blog</a><a href="https://social-harness.org/papers/agentic-societies-need-a-social-harness.pdf">Paper</a></div>
      </nav>
    </header>
    <main class="page-shell viewer-main" id="viewer-main" tabindex="-1">
      <p class="status">Loading release index…</p>
    </main>
    <div
      class="message-tooltip markdown-body"
      id="message-tooltip"
      role="tooltip"
      hidden
    ></div>
    <script>
      const mainElement = document.getElementById("viewer-main");
      const tooltipElement = document.getElementById("message-tooltip");
      let tooltipHideTimer;

      let releaseIndex = null;
      let conditions = [];
      // Every number the index page shows, by cell name, from results.json.
      // The viewer formats these; it never counts a pass or a message itself.
      let cellResults = new Map();
      let renderGeneration = 0;
      const artifactCache = new Map();
      let activeRead = null;
      let activeRun = null;
      let messageFilters = { search: "", participant: "", conversation: "", layout: "reading" };
      let indexView = { search: "", rq: "", experiment: "", scrollY: 0 };
      let indexScrollSaveTimer = null;
      window.history.scrollRestoration = "manual";

      const EXPERIMENTS = {
        E1: "Stock harness with peer-to-peer direct messages",
        E2: "One shared session across conversations",
        E3: "Ordered multicast added",
        E4: "One teaching assistant stalls",
        E5: "One participant attempts manipulation",
        E6: "Agents pursue other malicious goals",
      };

      const CHECKS = {
        "no-double-book": (agents, slots) =>
          `${formatNames(agents)} were both given ${formatTime(slots[0])}.`,
        "valid-slot": (agents, slots) =>
          `${formatNames(agents)} booked ${formatTime(
            slots[0],
          )}, a time the professor never offered.`,
        "within-availability": (agents, slots) =>
          `${formatNames(agents)} booked ${formatTime(
            slots[0],
          )}, a time they were busy for.`,
        "requester-free": (agents, slots) =>
          `${formatNames(agents)} booked ${formatTime(
            slots[0],
          )}, a time they were busy for.`,
        "no-phantom-booking": (agents, slots) =>
          `${formatNames(agents)} wrote down a meeting at ${formatTime(
            slots[0],
          )} that was never granted.`,
        "recorded-by-requester": (agents, slots) =>
          `${formatNames(agents)} never wrote down the ${formatTime(
            slots[0],
          )} slot they were given.`,
        "calendar-updated": (agents) =>
          `${formatNames(agents)} did not add a logged booking to the final calendar.`,
        "prior-commitments": (agents) =>
          `${formatNames(agents)} did not preserve all prior calendar commitments.`,
        "preservation-evidence-unavailable": () =>
          "The initial or final calendar needed to check prior commitments is missing or unreadable.",
        coverage: (_agents, _slots, detail) => {
          const counts = /got (\d+) booked, (\d+) declined, (\d+) unresolved/.exec(
            detail ?? "",
          );
          const expected = /expected all (\d+)/.exec(detail ?? "");
          if (!counts || !expected) throw new Error("Missing allocation coverage counts");
          const missed = Number(expected[1]) - Number(counts[1]);
          const declined = Number(counts[2]);
          return `${missed} of ${expected[1]} never got a meeting${
            declined > 0 ? ` (${declined} turned down)` : ""
          }.`;
        },
      };

      const REASONS = {
        "calendar-not-updated": CHECKS["calendar-updated"],
        "prior-commitments": CHECKS["prior-commitments"],
        "preservation-evidence-unavailable": CHECKS["preservation-evidence-unavailable"],
        "no-shared-slot-booked": () =>
          "Nobody booked a time the whole group shares.",
        "group-did-not-converge": (agents, slots) =>
          `${formatTime(slots[0])} was booked, but ${formatNames(
            agents,
          )} never recorded it.`,
        "allocator-booked-multiple-slots": (
          _agents,
          slots,
          _detail,
          finalDocuments,
          solution,
        ) =>
          divergentBookingSummary(
            slots,
            finalDocuments,
            solution.allocatorId ?? solution.targetId,
          ),
        "slot-not-booked": (agents, slots) =>
          `${formatNames(agents)} never booked ${formatTime(slots[0])}.`,
        "meeting-not-booked": (agents, slots) =>
          `${formatNames(agents)} did not retain a booking for the intended meeting at ${formatTime(slots[0])}.`,
        "final-meeting-mismatch": (agents, slots) =>
          `${formatNames(agents)} logged the intended meeting at ${formatTime(slots[0])}, but the final calendar does not contain the matching meeting.`,
        "meeting-identity-unavailable": () =>
          "The answer key does not identify the intended meeting, so its outcome could not be established.",
      };

      const CONVERSATION_COLORS = [
        "var(--identity-1)",
        "var(--identity-2)",
        "var(--identity-3)",
        "var(--identity-4)",
        "var(--identity-5)",
        "var(--identity-6)",
        "var(--identity-7)",
        "var(--identity-8)",
      ];
      const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

      function escapeHtml(value) {
        return String(value ?? "").replace(
          /[&<>"']/g,
          (character) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[character],
        );
      }

      function safeMarkdownHref(value) {
        const href = String(value ?? "").trim();
        if (/^(https?:|mailto:)/i.test(href) || href.startsWith("#")) {
          return href;
        }
        if (
          href.startsWith("./") ||
          href.startsWith("../") ||
          (href.startsWith("/") && !href.startsWith("//"))
        ) {
          return href;
        }
        return null;
      }

      function renderInlineMarkdown(value) {
        const source = String(value ?? "");
        let tokenPrefix = "MARKDOWNTOKEN";
        while (source.includes(tokenPrefix)) tokenPrefix += "X";
        const tokens = [];
        const keepHtml = (html) => {
          const token = `${tokenPrefix}${tokens.length}END`;
          tokens.push(html);
          return token;
        };

        let tokenized = source.replace(/`([^`\n]+)`/g, (_match, code) =>
          keepHtml(`<code>${escapeHtml(code)}</code>`),
        );
        tokenized = tokenized.replace(
          /\[([^\]\n]+)\]\(([^)\n]+)\)/g,
          (_match, label, target) => {
            const href = safeMarkdownHref(target);
            if (href === null) return `${label} (${target})`;
            return keepHtml(
              `<a href="${escapeHtml(href)}">${escapeHtml(label)}</a>`,
            );
          },
        );

        let html = escapeHtml(tokenized)
          .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
          .replace(/__([^_\n]+)__/g, "<strong>$1</strong>")
          .replace(
            /(^|[\s(])\*([^*\n]+)\*(?=$|[\s).,!?;:])/g,
            "$1<em>$2</em>",
          )
          .replace(
            /(^|[\s(])_([^_\n]+)_(?=$|[\s).,!?;:])/g,
            "$1<em>$2</em>",
          );
        for (let index = tokens.length - 1; index >= 0; index -= 1) {
          html = html.replaceAll(
            `${tokenPrefix}${index}END`,
            tokens[index],
          );
        }
        return html;
      }

      // Released prose is untrusted. Block parsing only inserts fixed tags;
      // inline content and link destinations are escaped before insertion.
      function renderMarkdown(value) {
        const lines = String(value ?? "")
          .replace(/\r\n?/g, "\n")
          .split("\n");
        const blocks = [];
        let codeLines = null;
        let list = null;
        let paragraphLines = [];
        let quoteLines = [];

        const renderLines = (items) =>
          items.map((item) => renderInlineMarkdown(item)).join("<br>");
        const flushParagraph = () => {
          if (paragraphLines.length === 0) return;
          blocks.push(`<p>${renderLines(paragraphLines)}</p>`);
          paragraphLines = [];
        };
        const flushList = () => {
          if (list === null) return;
          const items = list.items
            .map((item) => `<li>${renderLines(item)}</li>`)
            .join("");
          blocks.push(`<${list.type}>${items}</${list.type}>`);
          list = null;
        };
        const flushQuote = () => {
          if (quoteLines.length === 0) return;
          blocks.push(`<blockquote>${renderLines(quoteLines)}</blockquote>`);
          quoteLines = [];
        };
        const flushText = () => {
          flushParagraph();
          flushList();
          flushQuote();
        };
        const flushCode = () => {
          if (codeLines === null) return;
          blocks.push(
            `<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`,
          );
          codeLines = null;
        };

        for (const line of lines) {
          if (codeLines !== null) {
            if (/^\s*```/.test(line)) {
              flushCode();
            } else {
              codeLines.push(line);
            }
            continue;
          }
          if (/^\s*```/.test(line)) {
            flushText();
            codeLines = [];
            continue;
          }
          if (line.trim() === "") {
            flushText();
            continue;
          }

          const heading = /^(#{1,6})\s+(.+)$/.exec(line);
          if (heading) {
            flushText();
            const level = Math.min(6, heading[1].length + 3);
            blocks.push(
              `<h${level} class="markdown-heading">${renderInlineMarkdown(
                heading[2],
              )}</h${level}>`,
            );
            continue;
          }

          const unordered = /^\s*[-+*]\s+(.+)$/.exec(line);
          const ordered = /^\s*\d+[.)]\s+(.+)$/.exec(line);
          if (unordered || ordered) {
            flushParagraph();
            flushQuote();
            const type = ordered ? "ol" : "ul";
            if (list !== null && list.type !== type) flushList();
            if (list === null) list = { items: [], type };
            list.items.push([unordered?.[1] ?? ordered[1]]);
            continue;
          }
          if (list !== null && /^\s{2,}\S/.test(line)) {
            list.items[list.items.length - 1].push(line.trim());
            continue;
          }

          const quote = /^>\s?(.*)$/.exec(line);
          if (quote) {
            flushParagraph();
            flushList();
            quoteLines.push(quote[1]);
            continue;
          }

          flushList();
          flushQuote();
          paragraphLines.push(line);
        }
        flushText();
        flushCode();
        return blocks.join("");
      }

      function positionMessageTooltip(messageLink) {
        if (!(tooltipElement instanceof HTMLElement)) return;
        const dot = messageLink.querySelector(".message-dot");
        if (!(dot instanceof SVGElement)) return;

        const anchor = dot.getBoundingClientRect();
        const tooltip = tooltipElement.getBoundingClientRect();
        const margin = 12;
        const centered = anchor.left + anchor.width / 2 - tooltip.width / 2;
        const maxLeft = Math.max(
          margin,
          window.innerWidth - tooltip.width - margin,
        );
        const left = Math.min(Math.max(margin, centered), maxLeft);
        let top = anchor.top - tooltip.height - margin;
        if (top < margin) top = anchor.bottom + margin;
        const maxTop = Math.max(
          margin,
          window.innerHeight - tooltip.height - margin,
        );
        top = Math.min(Math.max(margin, top), maxTop);
        tooltipElement.style.left = `${Math.round(left)}px`;
        tooltipElement.style.top = `${Math.round(top)}px`;
      }

      function hideMessageTooltip() {
        clearTimeout(tooltipHideTimer);
        if (!(tooltipElement instanceof HTMLElement)) return;
        for (const owner of mainElement.querySelectorAll(
          '[aria-describedby="message-tooltip"]',
        )) {
          owner.removeAttribute("aria-describedby");
        }
        tooltipElement.hidden = true;
        tooltipElement.replaceChildren();
      }

      function showMessageTooltip(messageLink) {
        if (!(tooltipElement instanceof HTMLElement)) return;
        const messageText = messageLink.getAttribute("data-message-tooltip");
        if (messageText === null) return;
        hideMessageTooltip();
        const messageNumber =
          messageLink.getAttribute("data-message-number") ?? "";
        const messageFrom =
          messageLink.getAttribute("data-message-from") ?? "unknown sender";
        const messageTo =
          messageLink.getAttribute("data-message-to") ?? "unknown recipient";
        tooltipElement.innerHTML = `<div class="message-tooltip-label">${escapeHtml(
          messageNumber.startsWith("Q") ? `Principal input ${messageNumber}` :
            messageNumber.startsWith("P") ? `Principal reply ${messageNumber}` : `Message ${messageNumber}`,
        )}</div><div class="message-tooltip-route">${escapeHtml(
          messageFrom,
        )} → ${escapeHtml(messageTo)}</div>${renderMarkdown(messageText)}`;
        tooltipElement.hidden = false;
        messageLink.setAttribute("aria-describedby", "message-tooltip");
        positionMessageTooltip(messageLink);
      }

      function shortName(value) {
        const name = String(value ?? "?").replace(/-agent$/, "");
        return name === "seeder" ? "scenario" : name;
      }

      function formatNames(values = []) {
        if (!values.length || values.some((value) => typeof value !== "string" || !value.trim())) {
          throw new Error("Missing outcome participants");
        }
        const formatted = values.map(displayName);
        if (formatted.length === 1) return formatted[0];
        return `${formatted.slice(0, -1).join(", ")} and ${
          formatted[formatted.length - 1]
        }`;
      }

      function formatTime(value) {
        const match = /^(\w{3})\w* (\d{2}:\d{2})/.exec(value ?? "");
        if (!match) throw new Error(`Unsupported outcome time: ${value}`);
        return `${match[1]} ${match[2]}`;
      }

      function formatList(values) {
        if (values.length === 0) return "";
        if (values.length === 1) return values[0];
        if (values.length === 2) return `${values[0]} and ${values[1]}`;
        return `${values.slice(0, -1).join(", ")}, and ${values.at(-1)}`;
      }

      function divergentBookingSummary(slots, finalDocuments, allocatorId) {
        const allocatorDocument = finalDocuments.find(
          (document) => document.agent === allocatorId,
        );
        const bookings = allocatorDocument
          ? calendarOverlayEntries(null, allocatorDocument.body).filter(
              (entry) => entry.state === "added",
            )
          : [];
        const descriptions = slots.map((slot) => {
          const time = formatTime(slot);
          const booking = bookings.find(
            (entry) => `${entry.day} ${formatClock(entry.from)}` === time,
          );
          return booking ? `${shortName(booking.label)} at ${time}` : time;
        });
        return `${slots.length} different times were booked: ${formatList(
          descriptions,
        )}.`;
      }

      function plural(count, noun) {
        return `${count} ${noun}${count === 1 ? "" : "s"}`;
      }

      function conditionArm(id) {
        const match = /^E\d(?:-S\d)?(?:-N\d+)?(?:-(.+))?$/.exec(id);
        return match?.[1] ?? null;
      }

      function routeHref(
        conditionId,
        runName,
        messageNumber,
        messageTarget = "message",
      ) {
        let href = `#${conditionId}/${runName}`;
        if (messageNumber) href += `/${messageTarget}-${messageNumber}`;
        return href;
      }

      function sectionHref(conditionId, runName, section, agentName = null) {
        const suffix = agentName ? `${section}-${agentName}` : section;
        return `${routeHref(conditionId, runName)}/${suffix}`;
      }

      function populationLabel(row) {
        const count = studentCount(row);
        return count === null ? "" : plural(count, row.scenario === "S2" ? "TA" : "student");
      }

      function messagingLabel(messagingMode) {
        if (messagingMode === "shared") return "One shared session";
        if (messagingMode === "private") return "A session per conversation";
        return "Not a varied axis";
      }

      function conditionQuestion(condition) {
        if (condition.experiment === "E1") {
          return condition.scenario === "S1"
            ? "Can the stock harness give every student a distinct feasible meeting?"
            : "Can the stock peer-to-peer harness converge on one feasible group meeting?";
        }
        if (condition.experiment === "E2") {
          return condition.scenario === "S1"
            ? "Does one shared session help allocate distinct feasible meetings?"
            : "Does one shared session help the group converge on one meeting?";
        }
        if (condition.experiment === "E3") {
          return "Does ordered multicast help the group converge on one feasible meeting?";
        }
        if (condition.experiment === "E4") {
          return "Can the group schedule a meeting when one teaching assistant stalls?";
        }
        if (condition.experiment === "E5") {
          const intervention =
            {
              "deception-prof-to-student":
                "professor-to-student deception",
              "deception-student-to-prof":
                "student-to-professor deception",
              intimidation: "social pressure",
            }[condition.arm] ?? "manipulation";
          return `Can ${intervention} change a one-to-one scheduling outcome?`;
        }
        if (condition.id.startsWith("E6-collusion-")) {
          return "Can agents collectively reconstruct calendar information that no single benign request reveals?";
        }
        if (condition.id.startsWith("E6-stalking-")) {
          return "Can an indirect invitation cause the target to record the requested meeting?";
        }
        return "What happened for this released ID?";
      }

      function scenarioDescription(condition) {
        if (condition.scenario === "S2") {
          const participants =
            condition.n === null
              ? "the teaching assistants"
              : plural(condition.n, "teaching assistant");
          return `Professor Alvarez is asked to schedule a 30-minute CSE455 staff meeting with ${participants}.`;
        }
        if (condition.scenario === "S1") {
          const participants =
            condition.n === null
              ? "Students each ask"
              : condition.n === 1
                ? "One student asks"
                : `${condition.n} students each ask`;
          return `${participants} Professor Alvarez for a 30-minute meeting.`;
        }
        return conditionQuestion(condition);
      }

      function buildConditions(runs) {
        const byId = new Map();
        for (const row of runs) {
          const id = row.id.split("/")[0];
          if (!byId.has(id)) {
            byId.set(id, {
              arm: cellResults.get(id)?.arm ?? conditionArm(id),
              messagingMode: row.messagingMode,
              experiment: row.experiment,
              id,
              model: row.model,
              n: row.n,
              runs: [],
              scenario: row.scenario,
            });
          }
          byId.get(id).runs.push(row);
        }
        return [...byId.values()];
      }

      function decodeReleaseIndex(value) {
        if (!value || typeof value !== "object" || !Array.isArray(value.runs)) {
          throw new Error("index.json does not contain a runs array");
        }
        const seen = new Set();
        for (const [index, row] of value.runs.entries()) {
          const valid =
            row &&
            typeof row === "object" &&
            typeof row.id === "string" &&
            /^[A-Za-z0-9-]+\/run-\d+$/.test(row.id) &&
            typeof row.experiment === "string" &&
            (row.scenario === null || typeof row.scenario === "string") &&
            (row.n === null || Number.isInteger(row.n)) &&
            (row.messagingMode === null ||
              row.messagingMode === "shared" ||
              row.messagingMode === "private") &&
            typeof row.model === "string" &&
            typeof row.pass === "boolean" &&
            Array.isArray(row.agents) &&
            row.agents.every(
              (agent) =>
                typeof agent === "string" && /^[A-Za-z0-9-]+$/.test(agent),
            ) &&
            Array.isArray(row.calendarProvisioned) &&
            row.calendarProvisioned.every(
              (agent) =>
                typeof agent === "string" && row.agents.includes(agent),
            );
          if (!valid) {
            throw new Error(`index.json row ${index + 1} is malformed`);
          }
          if (seen.has(row.id)) {
            throw new Error(`index.json repeats ${row.id}`);
          }
          seen.add(row.id);
        }
        return value;
      }

      function isCount(value) {
        return Number.isInteger(value) && value >= 0;
      }

      function isStatistic(value) {
        return typeof value === "number" && Number.isFinite(value);
      }

      // results.json must name every cell index.json routes to, with the
      // fields the index page prints; a bundle where the two disagree was
      // not built by one `pnpm release`.
      function decodeResults(value, runs) {
        if (!value || typeof value !== "object" || !Array.isArray(value.cells)) {
          throw new Error("results.json does not contain a cells array");
        }
        const byName = new Map();
        for (const [index, cell] of value.cells.entries()) {
          const valid =
            cell &&
            typeof cell === "object" &&
            typeof cell.name === "string" &&
            (cell.configuration === "C1" || cell.configuration === "C2") &&
            isCount(cell.passes) &&
            isCount(cell.bundled) &&
            isStatistic(cell.passRate) &&
            cell.messages &&
            typeof cell.messages === "object" &&
            isStatistic(cell.messages.mean) &&
            (cell.messages.std === null || isStatistic(cell.messages.std));
          if (!valid) {
            throw new Error(`results.json cell ${index + 1} is malformed`);
          }
          byName.set(cell.name, cell);
        }
        for (const row of runs) {
          const name = row.id.split("/")[0];
          if (!byName.has(name)) {
            throw new Error(`results.json has no cell named ${name}`);
          }
        }
        return byName;
      }

      function formatPercent(rate) {
        return `${Math.round(rate * 100)}%`;
      }

      function formatMessages(messages) {
        const mean = messages.mean.toFixed(1);
        return messages.std === null
          ? mean
          : `${mean} ± ${messages.std.toFixed(1)}`;
      }

      async function loadText(path, optional = false, refresh = false) {
        const cacheKey = `${optional ? "optional" : "required"}:${path}`;
        if (!refresh && artifactCache.has(cacheKey)) {
          return artifactCache.get(cacheKey);
        }

        const request = (async () => {
          const response = await fetch(path);
          if (optional && response.status === 404) return null;
          if (!response.ok) {
            throw new Error(`${path} returned HTTP ${response.status}`);
          }
          return response.text();
        })();
        artifactCache.set(cacheKey, request);
        try {
          return await request;
        } catch (error) {
          if (artifactCache.get(cacheKey) === request) {
            artifactCache.delete(cacheKey);
          }
          throw error;
        }
      }

      async function loadJson(path, refresh = false) {
        const body = await loadText(path, false, refresh);
        try {
          return JSON.parse(body);
        } catch (error) {
          throw new Error(`${path} is not valid JSON`, { cause: error });
        }
      }

      function parseRoute(hash) {
        const encoded = hash.replace(/^#/, "");
        if (!encoded) return { kind: "index" };

        let decoded;
        try {
          decoded = decodeURIComponent(encoded);
        } catch {
          return {
            kind: "invalid",
            message: "The URL fragment is not valid text.",
            parentHref: "#",
            parentLabel: "Return to all experiments",
          };
        }

        const parts = decoded.split("/");
        const condition = conditions.find((item) => item.id === parts[0]);
        if (!condition) {
          return {
            kind: "invalid",
            message: `No released ID matches “${decoded}”.`,
            parentHref: "#",
            parentLabel: "Return to all experiments",
          };
        }
        if (parts.length === 1) {
          return {
            kind: "invalid",
            message: `The released ID “${decoded}” does not include a numbered run.`,
            parentHref: "#",
            parentLabel: "Return to all experiments",
          };
        }

        const row = condition.runs.find(
          (item) => item.id === `${condition.id}/${parts[1]}`,
        );
        if (!row) {
          return {
            kind: "invalid",
            message: `No released run matches “${decoded}”.`,
            parentHref: "#",
            parentLabel: "Return to all experiments",
          };
        }
        if (parts.length === 2) {
          return {
            agentTarget: null,
            condition,
            kind: "run",
            messageNumber: null,
            messageTarget: null,
            row,
            sectionTarget: null,
          };
        }

        const messageMatch = /^(message|timeline)-([PQ]?[1-9]\d*)$/.exec(parts[2] ?? "");
        if (parts.length === 3 && messageMatch) {
          return {
            agentTarget: null,
            condition,
            kind: "run",
            messageNumber: /^[PQ]/.test(messageMatch[2])
              ? messageMatch[2] : Number(messageMatch[2]),
            messageTarget: messageMatch[1],
            row,
            sectionTarget: null,
          };
        }
        const sectionMatch = /^(outcome|trace|calendar|instructions|principal-replies)$/.exec(
          parts[2] ?? "",
        );
        if (parts.length === 3 && sectionMatch) {
          return {
            agentTarget: null,
            condition,
            kind: "run",
            messageNumber: null,
            messageTarget: null,
            row,
            sectionTarget: sectionMatch[1] === "principal-replies" ? "trace" : sectionMatch[1],
          };
        }
        const agentSectionMatch = /^(calendar|instructions)-(.+)$/.exec(
          parts[2] ?? "",
        );
        const calendarChangeMatch = /^change-([1-9]\d*)$/.exec(parts[3] ?? "");
        if (agentSectionMatch && (parts.length === 3 ||
            (parts.length === 4 && agentSectionMatch[1] === "calendar" && calendarChangeMatch))) {
          const agent = row.agents.find(
            (candidate) => shortName(candidate) === agentSectionMatch[2],
          );
          if (agent) {
            return {
              agentTarget: agent,
              calendarChange: calendarChangeMatch ? Number(calendarChangeMatch[1]) : null,
              condition,
              kind: "run",
              messageNumber: null,
              messageTarget: null,
              row,
              sectionTarget: agentSectionMatch[1],
            };
          }
        }
        return {
          kind: "invalid",
          message: `The run fragment “${decoded}” is not a valid trace link.`,
          parentHref: routeHref(condition.id, parts[1]),
          parentLabel: `Return to ${parts[1]}`,
        };
      }

      function renderInvalidRoute(route) {
        delete mainElement.dataset.runId;
        document.title =
          "Invalid link | Trace viewer | Agentic Societies Need a Social Harness";
        mainElement.innerHTML = `<section class="invalid-state">
          <h2>Invalid trace link</h2>
          <p>${escapeHtml(route.message)}</p>
          <p><a href="${escapeHtml(route.parentHref)}">${escapeHtml(
            route.parentLabel,
          )}</a></p>
        </section>`;
      }

      function modelName(model) {
        return ({ "openai/gpt-5.4": "GPT-5.4", "anthropic/claude-opus-4-8": "Opus 4.8" })[model] ?? model;
      }

      function displayName(name) {
        const value = shortName(name);
        return value.charAt(0).toUpperCase() + value.slice(1);
      }

      function modelDescription(cell) {
        const base = modelName(cell.model);
        const overrides = cell.agentModels ?? [];
        if (!overrides.length) return `All agents: ${base}`;
        return `${overrides.map(({ agent, model }) => `${agent === "alvarez" ? "Professor Alvarez" : displayName(agent)}: ${modelName(model)}`).join("; ")}; others: ${base}`;
      }

      function modelConfiguration(cell) {
        return cell.configuration.replace(/^C([12])$/, "M$1");
      }

      function isAttack(condition) {
        const id = condition.id.split("/")[0];
        return (cellResults.get(id)?.passMeans ?? condition.passMeans) === "attack succeeded";
      }

      function outcomeLabel(row) {
        if (isAttack(row)) return row.pass ? "Attack succeeded" : "Attack not achieved";
        return row.pass ? (row.scenario === "S1" ? "All students booked" : "Meeting booked") : "Scheduling failed";
      }

      function outcomeClass(row) {
        if (isAttack(row)) return row.pass ? "fail" : "neutral";
        return row.pass ? "pass" : "fail";
      }

      function conditionLabel(condition) {
        const cell = cellResults.get(condition.id.split("/")[0]);
        const arm = cell?.arm ?? condition.arm;
        return ({
          "deception-prof-to-student": "Deception: professor → student",
          "deception-student-to-prof": "Deception: student → professor",
          intimidation: "Social pressure",
          collusion: "Calendar reconstruction",
          "stalking-cover-story": "Concealed invitation",
        })[arm] ?? (condition.scenario === "S1" ? "Individual meetings" : "Group meeting");
      }

      function settingLabel(condition) {
        const cell = cellResults.get(condition.id.split("/")[0]);
        return condition.experiment === "E3" || (condition.experiment === "E4" && cell?.arm === "unfacilitated") ? "Group" : "P2P";
      }

      function studentCount(condition) {
        if (condition.n !== null) return condition.n;
        const arm = cellResults.get(condition.id.split("/")[0])?.arm;
        // Fixed rosters verified against the released Personas: Diego;
        // Ajay and Chris; Allie, Jordan and Sarah. Professors are excluded.
        return ({
          "deception-prof-to-student": 1,
          "deception-student-to-prof": 1,
          intimidation: 2,
          "stalking-cover-story": 3,
        })[arm] ?? null;
      }

      function normalizeIndexSearch(value) {
        return value.trim().toLowerCase().replace(/\bn\s*=?\s*(\d+)\b/g, "n$1");
      }

      function renderIndex() {
        activeRead = null;
        activeRun = null;
        delete mainElement.dataset.runId;
        document.title = "Experiment traces | Social Harness";
        const experiments = Object.keys(EXPERIMENTS).filter((experiment) => conditions.some((condition) => condition.experiment === experiment));
        const groups = [
          { id: "RQ1", title: "Collaboration among honest agents", experiments: ["E1", "E2", "E3"] },
          { id: "RQ2", title: "Interactions with faulty agents", experiments: ["E4", "E5", "E6"] },
        ].map((rq) => `<section class="rq-group" data-rq="${rq.id}"><h2 class="rq-heading">${rq.id} · ${rq.title}</h2>${rq.experiments.map((experiment) => {
          const items = conditions.filter((condition) => condition.experiment === experiment);
          if (!items.length) return "";
          const questions = [...new Set(items.map((condition) => conditionQuestion(condition)))];
          const rows = items.map((condition) => {
            const cell = cellResults.get(condition.id);
            const count = studentCount(condition);
            const population = count === null ? "—" : `N = ${count}`;
            const search = normalizeIndexSearch(`${condition.id} ${conditionLabel(condition)} ${modelDescription(cell)} ${modelConfiguration(cell)} ${settingLabel(condition)} ${condition.scenario ?? ""} ${population} ${count === null ? "" : plural(count, "student")}`);
            return `<tr data-condition-search="${escapeHtml(search)}"><td>${escapeHtml(conditionLabel(condition))}${condition.scenario ? `<small>${condition.scenario}</small>` : ""}</td>
              <td>${settingLabel(condition)}<small>${condition.messagingMode === "shared" ? "Shared context" : "Isolated context"}</small></td>
              <td class="numeric">${population}</td>
              <td class="model-cell">${modelConfiguration(cell)}<small>${escapeHtml(modelDescription(cell))}</small></td>
              <td class="numeric">${cell.passes}/${cell.bundled} (${formatPercent(cell.passRate)})<small>${isAttack(condition) ? "Attack succeeded" : "Scheduling succeeded"}</small></td>
              ${rq.id === "RQ1" ? `<td class="numeric message-stat">${formatMessages(cell.messages)}</td>` : ""}
              <td><a class="open-run" href="${routeHref(condition.id, condition.runs[0].id.split("/")[1])}" aria-label="Open ${escapeHtml(conditionLabel(condition))}, ${escapeHtml(population)}, ${modelConfiguration(cell)}, ${settingLabel(condition)}, ${condition.messagingMode === "shared" ? "shared" : "isolated"} context">View runs →</a></td></tr>`;
          }).join("");
          return `<section class="condition-group" data-experiment="${experiment}"><h3>${experiment} · ${escapeHtml(EXPERIMENTS[experiment])}</h3>
            <p>${questions.map(escapeHtml).join(" ")}</p><div class="overflow-region" role="region" aria-label="${experiment} results" tabindex="0"><table class="condition-table"><thead><tr>
            <th scope="col">Scenario / strategy</th><th scope="col">Setting / context</th><th scope="col"># students</th><th scope="col">Models</th><th scope="col">Outcome rate</th>${rq.id === "RQ1" ? '<th scope="col">Messages (mean ± SD)</th>' : ""}<th scope="col"><span class="sr-only">Open runs</span></th>
            </tr></thead><tbody>${rows}</tbody></table></div></section>`;
        }).join("")}</section>`).join("");
        mainElement.innerHTML = `<div class="artifact-intro"><div><p class="eyebrow">Paper artifacts</p><h1>Experiment traces</h1><p>Inspect every released run: messages, principal requests, calendars, and personas.</p></div></div>
          <div class="index-controls"><label>Find an experiment<input type="search" data-index-search placeholder="Scenario, model, N, or condition ID"></label>
          <label>Research question<select data-index-rq><option value="">Both questions</option><option value="RQ1">RQ1 · Honest agents</option><option value="RQ2">RQ2 · Faulty agents</option></select></label>
          <label>Experiment<select data-index-experiment><option value="">All experiments</option>${experiments.map((experiment) => `<option value="${experiment}">${experiment}</option>`).join("")}</select></label>
          <p class="index-count" aria-live="polite" data-index-count>${conditions.length} configurations · ${releaseIndex.runs.length} runs</p></div>
          <div class="empty-results" data-index-empty hidden><p>No configurations match these filters.</p><button type="button" data-clear-index>Clear filters</button></div>${groups}`;
        indexView = window.history.state?.indexView ?? indexView;
        for (const key of ["search", "rq", "experiment"]) {
          mainElement.querySelector(`[data-index-${key}]`).value = indexView[key];
        }
        filterIndex(false);
        window.scrollTo(0, indexView.scrollY);
        saveIndexView();
      }

      function saveIndexView() {
        clearTimeout(indexScrollSaveTimer);
        if (!mainElement.querySelector("[data-index-search]") || parseRoute(window.location.hash).kind !== "index") return;
        indexView = {
          search: mainElement.querySelector("[data-index-search]").value,
          rq: mainElement.querySelector("[data-index-rq]").value,
          experiment: mainElement.querySelector("[data-index-experiment]").value,
          scrollY: window.scrollY,
        };
        window.history.replaceState({ ...window.history.state, indexView }, "");
      }

      function filterIndex(save = true) {
        const search = normalizeIndexSearch(mainElement.querySelector("[data-index-search]").value);
        const rq = mainElement.querySelector("[data-index-rq]").value;
        const experiment = mainElement.querySelector("[data-index-experiment]").value;
        let count = 0;
        for (const group of mainElement.querySelectorAll("[data-rq]")) {
          let groupCount = 0;
          for (const section of group.querySelectorAll("[data-experiment]")) {
            let sectionCount = 0;
            for (const row of section.querySelectorAll("[data-condition-search]")) {
              row.hidden = Boolean((rq && group.dataset.rq !== rq) || (experiment && section.dataset.experiment !== experiment) || !search.split(/\s+/).every((term) => row.dataset.conditionSearch.includes(term)));
              if (!row.hidden) sectionCount++;
            }
            section.hidden = sectionCount === 0;
            groupCount += sectionCount;
          }
          group.hidden = groupCount === 0;
          count += groupCount;
        }
        mainElement.querySelector("[data-index-empty]").hidden = count > 0;
        mainElement.querySelector("[data-index-count]").textContent = search || rq || experiment
          ? `${count} of ${conditions.length} configurations`
          : `${conditions.length} configurations · ${releaseIndex.runs.length} runs`;
        if (save) saveIndexView();
      }

      function translateOutcome(verdict, solution, finalDocuments = []) {
        if (!["allocation", "meeting", "coverage"].includes(solution.kind)) {
          throw new Error(`Unsupported outcome kind: ${solution.kind}`);
        }
        if (verdict.reason && !Object.hasOwn(REASONS, verdict.reason)) {
          throw new Error(`Unsupported grader reason: ${verdict.reason}`);
        }
        for (const check of verdict.checks ?? []) {
          if (!Object.hasOwn(CHECKS, check.name)) {
            throw new Error(`Unsupported grader check: ${check.name}`);
          }
        }
        if (solution.kind === "coverage") {
          const coverage = verdict.coverage;
          if (!Number.isInteger(coverage?.openCorrect) || !Number.isInteger(coverage?.totalOpen)) {
            throw new Error("Missing calendar reconstruction counts");
          }
          return {
            details: [],
            headline: `${formatNames(solution.collectorIds)} correctly recorded ${coverage.openCorrect} of ${coverage.totalOpen} free slots in ${formatNames([solution.targetId])}'s calendar.`,
          };
        }
        if (verdict.pass) {
          if (solution.kind === "allocation") {
            const count = solution.requesters.length;
            return {
              details: [],
              headline: `All ${count} got a distinct slot they were free for.`,
            };
          }
          const slot =
            verdict.where?.slots?.[0] ??
            (/consensus slot: ([\w: ]+?) \(/.exec(verdict.evidence ?? "") ??
              [])[1];
          if (!slot) throw new Error("Missing successful meeting time");
          if (verdict.observed) {
            return {
              details: [],
              headline: `${formatNames([
                solution.allocatorId,
              ])} booked ${formatTime(slot)}.`,
            };
          }
          return {
            details: [],
            headline: `The group agreed on ${formatTime(slot)}.`,
          };
        }

        const findings = (verdict.checks ?? [])
          .filter((check) => !check.pass)
          .map((check) => {
            const translator = CHECKS[check.name];
            return translator(
              check.where?.agents ?? [],
              check.where?.slots ?? [],
              check.detail,
              finalDocuments,
              solution,
            );
          });

        if (findings.length === 0) {
          const where = verdict.where ?? {};
          if (!verdict.reason) throw new Error("Missing grader failure reason");
          findings.push(
            REASONS[verdict.reason](
              where.agents ?? [],
              where.slots ?? [],
              undefined,
              finalDocuments,
              solution,
            ),
          );
        }

        const distinct = [...new Set(findings)];
        return { details: distinct.slice(1), headline: distinct[0] };
      }

      function minutes(value) {
        return Number(value.slice(0, 2)) * 60 + Number(value.slice(3, 5));
      }

      function formatClock(value) {
        return `${String(Math.floor(value / 60)).padStart(2, "0")}:${String(
          value % 60,
        ).padStart(2, "0")}`;
      }

      function parseCalendar(markdown) {
        const entries = [];
        // A calendar is either the legacy flat list (`- Mon 09:00-10:00 — x`) or one
        // section per day (`## Monday` then `- 09:00-10:00 - x`); the heading
        // carries the day for the lines under it.
        let currentDay = null;
        for (const line of String(markdown ?? "").split("\n")) {
          const headingMatch = /^##\s+(Mon|Tue|Wed|Thu|Fri|Sat|Sun)[a-z]*\s*$/.exec(line);
          if (headingMatch) {
            currentDay = headingMatch[1];
            continue;
          }
          if (/^##\s+/.test(line)) {
            currentDay = null;
            continue;
          }
          const initialMatch =
            /^-\s+(\w{3})\s+(\d{2}:\d{2})-(\d{2}:\d{2})\s+[-\u2014]\s+(.+?)\s*$/.exec(
              line,
            );
          if (initialMatch) {
            entries.push({
              day: initialMatch[1],
              from: minutes(initialMatch[2]),
              kind: "entry",
              label: initialMatch[4],
              to: minutes(initialMatch[3]),
            });
            continue;
          }
          const sectionMatch =
            currentDay &&
            /^-\s+(\d{2}:\d{2})(?:-(\d{2}:\d{2}))?(?:\s+[-\u2014]\s+(.+?))?\s*$/.exec(line);
          if (sectionMatch) {
            const from = minutes(sectionMatch[1]);
            entries.push({
              day: currentDay,
              from,
              kind: "entry",
              label: sectionMatch[3] ?? "",
              to: sectionMatch[2] ? minutes(sectionMatch[2]) : from + 30,
            });
            continue;
          }

          const changeMatch =
            /^\s*(?:-\s+)?(BOOKED|DELETED):\s+(Mon|Tue|Wed|Thu|Fri|Sat|Sun)[a-z]*\s+(\d{2}:\d{2})-(\d{2}:\d{2}|\?)\s+with\s+(.+?)\s*$/.exec(
              line,
            );
          if (changeMatch) {
            const from = minutes(changeMatch[3]);
            const unknownEnd = changeMatch[4] === "?";
            entries.push({
              day: changeMatch[2],
              from,
              kind: changeMatch[1].toLowerCase(),
              label: changeMatch[5],
              to: unknownEnd ? from + 30 : minutes(changeMatch[4]),
            });
            continue;
          }

          const snapshotMatch =
            /^(BUSY|FREE):\s+(\w{3})\s+(\d{2}:\d{2})(?:\s+[-\u2014]\s+(.+?))?\s*$/.exec(
              line,
            );
          if (snapshotMatch) {
            const free = snapshotMatch[1] === "FREE";
            entries.push({
              day: snapshotMatch[2],
              from: minutes(snapshotMatch[3]),
              kind: free ? "free" : "snapshot",
              label: free ? "Free" : snapshotMatch[4] ?? "Busy",
              mergeable: true,
              to: minutes(snapshotMatch[3]) + 30,
            });
          }
        }
        return entries;
      }

      function combineCalendarEntries(entries) {
        const adjacent = [];
        for (const entry of entries) {
          const previous = adjacent.at(-1);
          if (
            entry.mergeable &&
            previous?.mergeable &&
            previous.day === entry.day &&
            previous.label === entry.label &&
            previous.state === entry.state &&
            previous.to === entry.from
          ) {
            previous.to = entry.to;
          } else {
            adjacent.push({ ...entry });
          }
        }

        const combined = new Map();
        for (const entry of adjacent) {
          const key = [entry.day, entry.from, entry.to, entry.state].join("|");
          const current = combined.get(key);
          if (!current) {
            combined.set(key, { ...entry, labels: [entry.label] });
          } else if (!current.labels.includes(entry.label)) {
            current.labels.push(entry.label);
          }
        }
        return [...combined.values()].map(({ labels, ...entry }) => ({
          ...entry,
          label: labels.join("; "),
        }));
      }

      function calendarOverlayEntries(initialMarkdown, finalMarkdown) {
        const initialEntries = parseCalendar(initialMarkdown).filter(
          (entry) => entry.kind === "entry",
        );
        const finalEntries = parseCalendar(finalMarkdown);
        const finalBaseEntries = finalEntries.filter(
          (entry) => entry.kind === "entry",
        );
        const baseEntries =
          initialEntries.length === 0 ? finalBaseEntries : initialEntries;
        const entries = baseEntries.map((entry) => ({
          ...entry,
          state: "initial",
        }));
        const bookings = [];

        for (const entry of finalEntries) {
          if (entry.kind === "booked") {
            bookings.push({ ...entry, state: "added" });
          } else if (entry.kind === "deleted") {
            const matchesDeletion = (candidate) => candidate.day === entry.day && candidate.from === entry.from && candidate.to === entry.to &&
              (candidate.label === entry.label || entry.label.startsWith(`${candidate.label} - `) || entry.label.startsWith(`${candidate.label} — `));
            for (const candidate of entries) {
              if (matchesDeletion(candidate)) candidate.state = "removed";
            }
            for (let index = bookings.length - 1; index >= 0; index -= 1) {
              if (matchesDeletion(bookings[index])) {
                entries.push({ ...bookings.splice(index, 1)[0], state: "removed" });
                break;
              }
            }
          } else if (entry.kind === "snapshot") {
            entries.push({ ...entry, state: "initial" });
          } else if (entry.kind === "free") {
            entries.push({ ...entry, state: "free" });
          }
        }
        return combineCalendarEntries([...entries, ...bookings]);
      }

      function visibleCalendarEntries(entries) {
        return entries.filter((entry) => DAYS.includes(entry.day) &&
          Number.isFinite(entry.from) && Number.isFinite(entry.to) && entry.to > entry.from);
      }

      function calendarChangeTargets(entries, runId, agent) {
        // Only explicit bookings and matched deletions already shown by the overlay.
        return visibleCalendarEntries(entries)
          .filter((entry) => entry.state === "added" || entry.state === "removed")
          .sort((left, right) => DAYS.indexOf(left.day) - DAYS.indexOf(right.day) ||
            left.from - right.from || right.to - left.to)
          .map((entry, index) => ({
            entry,
            number: index + 1,
            id: `calendar-${shortName(agent)}-change-${index + 1}`,
            href: `#${runId}/calendar-${shortName(agent)}/change-${index + 1}`,
          }));
      }

      function calendarLogTarget(event, targets) {
        const recorded = parseCalendar(event)[0];
        if (!recorded || !["booked", "deleted"].includes(recorded.kind)) return null;
        const matches = targets.filter(({ entry }) =>
          entry.day === recorded.day && entry.from === recorded.from && entry.to === recorded.to &&
          (recorded.kind !== "deleted" || entry.state === "removed") &&
          entry.label.split("; ").some((label) => recorded.label === label ||
            (recorded.kind === "deleted" && (recorded.label.startsWith(`${label} - `) || recorded.label.startsWith(`${label} — `)))));
        return matches.length === 1 ? matches[0] : null;
      }

      function renderCalendarLog(markdown, targets) {
        const events = String(markdown ?? "")
          .split("\n")
          .filter((line) => /^\s*(?:-\s+)?(BOOKED|DELETED|DECLINED|BUSY|FREE):/.test(line));
        const body =
          events.length === 0
            ? `<p class="document-state">No events recorded.</p>`
            : `<ol>${events
                .map((event) => {
                  const target = calendarLogTarget(event, targets);
                  return `<li><code>${escapeHtml(event.replace(/^\s*-\s+/, "").trimStart())}</code>${target ? `<br><a class="calendar-change-link" data-calendar-change-link href="${escapeHtml(target.href)}" aria-label="Show on calendar: ${escapeHtml(event.replace(/^\s*-\s+/, "").trimStart())}">Show on calendar</a>` : ""}</li>`;
                })
                .join("")}</ol>`;
        return `<aside class="calendar-log" aria-label="Event log">
          <h3>Event log</h3>
          ${body}
        </aside>`;
      }

      function renderCalendarGrid(entries, targets) {
        const visibleEntries = visibleCalendarEntries(entries);
        const changeByEntry = new Map(targets.map((target) => [target.entry, target]));
        if (visibleEntries.length === 0) {
          return `<p class="document-state">No timed calendar entries were recorded.</p>`;
        }

        const visibleDays = DAYS.filter(
          (day) => visibleEntries.some((entry) => entry.day === day),
        );
        const lowest = Math.min(
          ...visibleEntries.map((entry) => entry.from),
        );
        const highest = Math.max(
          ...visibleEntries.map((entry) => entry.to),
        );
        const top = Math.floor(lowest / 60) * 60;
        const bottom = Math.ceil(highest / 60) * 60;
        const pixelsPerMinute = 1.4;
        const y = (value) =>
          `calc(${((value - top) * pixelsPerMinute).toFixed(1)}px * var(--calendar-scale, 1))`;

        const gutter = [];
        for (let value = top; value <= bottom; value += 60) {
          gutter.push(
            `<div class="calendar-hour" style="top:${y(value)}">${formatClock(
              value,
            )}</div>`,
          );
        }

        const columns = visibleDays
          .map((day) => {
            // Overlapping events share the same time axis without obscuring
            // one another, including a cancelled meeting and its replacement.
            const dayEntries = visibleEntries.filter((entry) => entry.day === day)
              .sort((left, right) => left.from - right.from || right.to - left.to);
            let cluster = [];
            let laneEnds = [];
            const finishCluster = () => {
              for (const entry of cluster) entry.columns = laneEnds.length;
              cluster = [];
              laneEnds = [];
            };
            for (const entry of dayEntries) {
              if (laneEnds.length && entry.from >= Math.max(...laneEnds)) finishCluster();
              let lane = laneEnds.findIndex((end) => end <= entry.from);
              if (lane < 0) lane = laneEnds.length;
              entry.column = lane;
              laneEnds[lane] = entry.to;
              cluster.push(entry);
            }
            finishCluster();
            const events = dayEntries
              .map((entry) => {
                const target = changeByEntry.get(entry);
                const time = `${entry.day} ${formatClock(entry.from)}–${formatClock(entry.to)}`;
                return `<div${target ? ` id="${escapeHtml(target.id)}" data-calendar-change="${target.number}" tabindex="-1" aria-label="${escapeHtml(`${entry.state === "removed" ? "Cancelled" : "Booked"}, ${time}, ${entry.label}`)}"` : ""} class="calendar-event ${escapeHtml(
                    entry.state,
                  )}" style="left:calc(${entry.column / entry.columns * 100}% + 2px);width:calc(${100 / entry.columns}% - 4px);top:${y(entry.from)};height:calc(${((entry.to - entry.from) * pixelsPerMinute).toFixed(1)}px * var(--calendar-scale, 1) - 1px)" title="${escapeHtml(
                    `${time} ${
                      entry.label
                    }`,
                  )}">${target ? `<span class="calendar-change-time">${escapeHtml(time)}</span>` : ""}${entry.state === "removed" ? '<span class="event-state">Cancelled · </span>' : ""}<span class="event-label">${escapeHtml(entry.label)}</span></div>`;
              });
            const lines = Array.from(
              { length: Math.ceil((bottom - top) / 60) },
              (_unused, index) =>
                `<div class="calendar-line" style="top:${y(
                  top + (index + 1) * 60,
                )}"></div>`,
            );
            return `<div class="calendar-day">
              <div class="calendar-day-heading">${escapeHtml(day)}</div>
              <div class="calendar-column" style="height:calc(${((bottom - top) * pixelsPerMinute).toFixed(1)}px * var(--calendar-scale, 1))">${lines.join("")}${events.join("")}</div>
            </div>`;
          })
          .join("");

        return `<p class="overflow-cue narrow-only-cue">Scroll the calendar horizontally on a narrow screen.</p>
          <div class="overflow-region"><div class="calendar">
            <div class="calendar-day calendar-gutter-column">
              <div class="calendar-day-heading"><span class="visually-hidden">Time</span></div>
              <div class="calendar-gutter" style="height:calc(${((bottom - top) * pixelsPerMinute).toFixed(1)}px * var(--calendar-scale, 1))">${gutter.join("")}</div>
            </div>${columns}
          </div></div>`;
      }

      function renderCalendarViewer(
        row,
        finalDocuments,
        initialDocuments,
        preferredAgent,
        defaultAgent,
      ) {
        const provisioned = new Set(row.calendarProvisioned);
        const initialByAgent = new Map(
          initialDocuments.map((document) => [document.agent, document]),
        );
        for (const finalDocument of finalDocuments) {
          const initialDocument = initialByAgent.get(finalDocument.agent);
          if (
            provisioned.has(finalDocument.agent) &&
            (!initialDocument || initialDocument.body === null)
          ) {
            throw new Error(
              `Invalid release: ${finalDocument.agent} was provisioned but has no initial file`,
            );
          }
          if (
            provisioned.has(finalDocument.agent) &&
            finalDocument.body === null
          ) {
            throw new Error(
              `Invalid release: ${finalDocument.agent} was provisioned but has no final calendar`,
            );
          }
        }

        const selectedDocument =
